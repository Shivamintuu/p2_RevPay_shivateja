<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <div th:replace="~{fragments/layout :: headFragment('Dashboard | RevPay')}"></div>
</head>

<body>
    <div th:replace="~{fragments/layout :: headerFragment}"></div>

    <div class="main-content" id="appMainContent">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 style="font-size: 2rem; font-weight: 800; letter-spacing: -0.5px; margin: 0;">
                <span id="welcomeMsg" th:text="${'Welcome, ' + session.user.fullName + '!'}"
                    style="background: linear-gradient(135deg, var(--primary), var(--secondary)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;">Welcome!</span>
                <span id="roleBadge" class="badge badge-primary" th:text="${session.user.role}"
                    style="margin-left:12px; vertical-align:middle;"></span>
            </h1>
        </div>

        <!-- Enterprise Balance Card -->
        <div class="enterprise-balance-card mb-4">
            <h3 style="font-weight: 500; font-size:1.1rem; opacity:0.9; margin:0;">Total Balance</h3>
            <div class="balance-amount" id="walletBalance" th:text="${'$' + #numbers.formatDecimal(walletBalance ?: 0, 1, 2)}">$0.00</div>
            <div class="balance-actions">
                <button onclick="window.location.href='/wallet'" class="btn">
                    <span>+</span> Add Funds
                </button>
                <button onclick="window.location.href='/wallet'" class="btn">
                    <span>↓</span> Withdraw
                </button>
                <button onclick="window.location.href='/transaction/send'" class="btn">
                    <span>↗</span> Send Money
                </button>
                <button onclick="window.location.href='/money-request/manage'" class="btn">
                    <span>⇄</span> Request
                </button>
            </div>
        </div>

        <!-- KPI Widgets (CSS Grid) -->
        <div
            style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 1.5rem; margin-bottom: 2rem;">

            <div class="card d-flex align-items-center gap-3" style="padding: 1.5rem;">
                <div
                    style="width: 56px; height: 56px; border-radius: 14px; background: var(--primary-light); color: var(--primary); display: flex; align-items: center; justify-content: center; font-size: 1.75rem;">
                    ✉
                </div>
                <div>
                    <div style="font-size: 1.75rem; font-weight: 800; color: var(--text-main); line-height: 1;"
                        id="pendingRequestsCount" th:text="${pendingRequestsCount ?: 0}">0</div>
                    <div style="color: var(--text-secondary); font-size: 0.9rem; font-weight: 500; margin-top: 5px;">
                        Pending Requests</div>
                </div>
            </div>

            <div class="card d-flex align-items-center gap-3" style="padding: 1.5rem;">
                <div
                    style="width: 56px; height: 56px; border-radius: 14px; background: var(--warning-bg); color: var(--warning-text); display: flex; align-items: center; justify-content: center; font-size: 1.75rem;">
                    🔔
                </div>
                <div>
                    <div style="font-size: 1.75rem; font-weight: 800; color: var(--text-main); line-height: 1;"
                        id="notificationCount" th:text="${notificationCount}">0</div>
                    <div style="color: var(--text-secondary); font-size: 0.9rem; font-weight: 500; margin-top: 5px;">
                        Unread Notifications</div>
                </div>
            </div>

            <!-- Business Only Cards -->
            <div th:if="${session.user.role.name() == 'BUSINESS'}" class="card d-flex align-items-center gap-3"
                style="padding: 1.5rem;">
                <div
                    style="width: 56px; height: 56px; border-radius: 14px; background: var(--success-bg); color: var(--success-text); display: flex; align-items: center; justify-content: center; font-size: 1.75rem;">
                    🟢
                </div>
                <div>
                    <div style="font-size: 1.75rem; font-weight: 800; color: var(--text-main); line-height: 1;"
                        id="totalReceived" th:text="${'$' + #numbers.formatDecimal(totalReceived ?: 0, 1, 2)}">$0.00</div>
                    <div style="color: var(--text-secondary); font-size: 0.9rem; font-weight: 500; margin-top: 5px;">
                        Total Received</div>
                </div>
            </div>

            <div th:if="${session.user.role.name() == 'BUSINESS'}" class="card d-flex align-items-center gap-3"
                style="padding: 1.5rem;">
                <div
                    style="width: 56px; height: 56px; border-radius: 14px; background: var(--danger-bg); color: var(--danger-text); display: flex; align-items: center; justify-content: center; font-size: 1.75rem;">
                    🔴
                </div>
                <div>
                    <div style="font-size: 1.75rem; font-weight: 800; color: var(--text-main); line-height: 1;"
                        id="totalSent" th:text="${'$' + #numbers.formatDecimal(totalSent ?: 0, 1, 2)}">$0.00</div>
                    <div style="color: var(--text-secondary); font-size: 0.9rem; font-weight: 500; margin-top: 5px;">
                        Total Sent</div>
                </div>
            </div>
        </div>

        <!-- Recent Transactions -->
        <div class="card">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h3 style="margin: 0; font-weight: 700; font-size: 1.25rem;">Recent Transactions</h3>
                <a th:href="@{/history}"
                    style="font-size: 0.9rem; font-weight: 600; background: var(--bg-color); padding: 6px 12px; border-radius: 6px;">View
                    All →</a>
            </div>

            <div th:if="${#lists.isEmpty(recentTransactions)}" id="noTransactions" class="text-center text-muted" style="padding: 3rem 1rem;">
                <div style="font-size: 3rem; margin-bottom: 1rem; opacity: 0.5;">📭</div>
                <p>No transactions yet. Start by sending money or adding funds.</p>
            </div>

            <div th:if="${!#lists.isEmpty(recentTransactions)}" style="overflow-x: auto;">
                <table id="transactionsTable" style="width: 100%; white-space: nowrap;">
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Type</th>
                            <th>Amount</th>
                            <th>Details</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="transactionList">
                        <tr th:each="t : ${recentTransactions}" style="border-bottom: 1px solid #f1f5f9;">
                            <td style="padding: 15px 0; font-size: 0.9rem;" th:text="${#temporals.format(t.timestamp, 'MMM dd, yyyy')}"></td>
                            <td style="padding: 15px 0;"><span th:class="'status-badge status-' + ${t.type.name().toLowerCase()}" th:text="${t.type}"></span></td>
                            <td style="padding: 15px 0; font-weight: 600;" 
                                th:class="${t.type.name() == 'SEND' || t.type.name() == 'WITHDRAW' ? 'text-danger' : 'text-success'}"
                                th:text="${(t.type.name() == 'SEND' || t.type.name() == 'WITHDRAW' ? '-' : '+') + '$' + t.amount}"></td>
                            <td style="padding: 15px 0; font-size: 0.9rem; color: #64748b;">
                                <span th:if="${t.recipient != null}" th:text="${'To: ' + t.recipient.fullName}"></span>
                                <span th:if="${t.sender != null && t.recipient == null}" th:text="${'From: ' + t.sender.fullName}"></span>
                            </td>
                            <td style="padding: 15px 0;"><span th:class="'status-badge status-' + ${t.status.name().toLowerCase()}" th:text="${t.status}"></span></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/layout :: footerFragment}"></div>

    <script>
        // interactive elements can still use app.js helpers
    </script>
</body>

</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: headFragment('Transaction History')}"></head>
<body class="bg-light">
    <div th:replace="~{fragments/layout :: headerFragment}"></div>

    <div class="container py-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="h2 font-weight-bold">Transaction History</h1>
            <a th:href="@{/history/export/csv(type=${currentType}, search=${currentSearch}, dateFrom=${currentDateFrom}, dateTo=${currentDateTo}, status=${currentStatus}, amountMin=${currentAmountMin}, amountMax=${currentAmountMax})}" 
               class="btn btn-success">
                Export CSV
            </a>
        </div>

        <!-- Filter Card -->
        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <form th:action="@{/history}" method="get" 
                      style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1.5rem; align-items: end;">
                    <div class="form-group" style="margin-bottom: 0;">
                        <label class="form-label" style="font-weight: 600; font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 0.4rem; display: block;">Search</label>
                        <input type="text" name="search" th:value="${currentSearch}" class="form-control" placeholder="ID, Name, Note..." 
                               style="width: 100%; padding: 0.6rem 0.8rem; border: 1px solid var(--border); border-radius: var(--radius-md);">
                    </div>
                    <div class="form-group" style="margin-bottom: 0;">
                        <label class="form-label" style="font-weight: 600; font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 0.4rem; display: block;">Type</label>
                        <select name="type" class="form-control" style="width: 100%; padding: 0.6rem 0.8rem; border: 1px solid var(--border); border-radius: var(--radius-md);">
                            <option value="ALL">All Types</option>
                            <option value="SEND" th:selected="${currentType == 'SEND'}">Send</option>
                            <option value="REQUEST" th:selected="${currentType == 'REQUEST'}">Request</option>
                            <option value="ADD_FUNDS" th:selected="${currentType == 'ADD_FUNDS'}">Add Funds</option>
                            <option value="WITHDRAW" th:selected="${currentType == 'WITHDRAW'}">Withdraw</option>
                            <option value="PAYMENT" th:selected="${currentType == 'PAYMENT'}">Payment</option>
                        </select>
                    </div>
                    <div class="form-group" style="margin-bottom: 0;">
                        <label class="form-label" style="font-weight: 600; font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 0.4rem; display: block;">Status</label>
                        <select name="status" class="form-control" style="width: 100%; padding: 0.6rem 0.8rem; border: 1px solid var(--border); border-radius: var(--radius-md);">
                            <option value="ALL">All Status</option>
                            <option value="COMPLETED" th:selected="${currentStatus == 'COMPLETED'}">Completed</option>
                            <option value="PENDING" th:selected="${currentStatus == 'PENDING'}">Pending</option>
                            <option value="FAILED" th:selected="${currentStatus == 'FAILED'}">Failed</option>
                        </select>
                    </div>
                    <div class="form-group" style="margin-bottom: 0;">
                        <label class="form-label" style="font-weight: 600; font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 0.4rem; display: block;">Date From</label>
                        <input type="date" name="dateFrom" th:value="${currentDateFrom}" class="form-control" style="width: 100%; padding: 0.6rem 0.8rem; border: 1px solid var(--border); border-radius: var(--radius-md);">
                    </div>
                    <div class="form-group" style="margin-bottom: 0;">
                        <label class="form-label" style="font-weight: 600; font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 0.4rem; display: block;">Date To</label>
                        <input type="date" name="dateTo" th:value="${currentDateTo}" class="form-control" style="width: 100%; padding: 0.6rem 0.8rem; border: 1px solid var(--border); border-radius: var(--radius-md);">
                    </div>
                    <div style="display: flex; align-items: end;">
                        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.65rem; white-space: nowrap;">
                            🔍 Filter
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Transactions Table -->
        <div class="card shadow-sm">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover mb-0">
                        <thead class="bg-light">
                            <tr>
                                <th>Date</th>
                                <th>Type</th>
                                <th>Amount</th>
                                <th>Recipient/Sender</th>
                                <th>Status</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="tx : ${transactions}">
                                <td th:text="${#temporals.format(tx.timestamp, 'MMM dd, yyyy HH:mm')}"></td>
                                <td>
                                    <span th:class="'badge badge-' + ${tx.type.name().toLowerCase()}" 
                                          th:text="${tx.type}"></span>
                                </td>
                                <td th:text="${'$' + tx.amount}" 
                                    th:class="${tx.type.name() == 'SEND' || tx.type.name() == 'WITHDRAW' ? 'text-danger' : 'text-success'}"></td>
                                <td>
                                    <span th:if="${tx.recipient != null}" th:text="${'To: ' + tx.recipient.fullName}"></span>
                                    <span th:if="${tx.sender != null && tx.recipient == null}" th:text="${'From: ' + tx.sender.fullName}"></span>
                                </td>
                                <td>
                                    <span th:class="'badge status-' + ${tx.status.name().toLowerCase()}" 
                                          th:text="${tx.status}"></span>
                                </td>
                                <td>
                                    <button class="btn btn-sm btn-outline-primary">Details</button>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(transactions)}">
                                <td colspan="6" class="text-center py-5 text-muted">No transactions found matching your filters.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/layout :: footerFragment}"></div>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <div th:replace="~{fragments/layout :: headFragment('Money Requests - RevPay')}"></div>
    <!-- Custom styles removed, using global style.css -->
</head>

<body>
    <div th:replace="~{fragments/layout :: headerFragment}"></div>

    <div class="main-content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 style="font-size: 2rem; font-weight: 800; letter-spacing: -0.5px; margin: 0;">Money Requests</h1>
        </div>

        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 1.5rem; align-items: start;">
            <!-- Send Request Form -->
            <div class="card" style="padding: 2rem;">
                <h3 style="font-size: 1.25rem; font-weight: 700; margin-bottom: 1.5rem; color: var(--text-main);">Request Money</h3>
                <form id="reqForm" onsubmit="event.preventDefault(); sendRequest();">
                    <div class="form-group">
                        <label>Requestee Email or Phone</label>
                        <input type="text" id="reqIdentifier" placeholder="name@example.com or +1 234..." required>
                    </div>
                    <div class="form-group">
                        <label>Amount ($)</label>
                        <input type="number" id="reqAmount" step="0.01" min="0.01" placeholder="0.00" required>
                    </div>
                    <div class="form-group mb-4">
                        <label>Purpose</label>
                        <textarea id="reqPurpose" rows="2" placeholder="What is this request for?" required></textarea>
                    </div>
                    <div id="reqMsg" class="alert mt-2" style="display: none;"></div>
                    <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.8rem; font-size: 1rem;">
                        Send Request
                    </button>
                </form>
            </div>

            <!-- Requests Lists -->
            <div style="display: flex; flex-direction: column; gap: 1.5rem;">
                <!-- Incoming Requests -->
                <div class="card" style="padding: 1.5rem;">
                    <h3 style="font-size: 1.1rem; font-weight: 700; margin-bottom: 1rem; color: var(--text-main); display: flex; align-items: center; justify-content: space-between;">
                        Incoming Requests
                        <span class="badge" style="background: var(--primary-light); color: var(--primary);">Received</span>
                    </h3>
                    <div th:if="${incomingRequests == null || #lists.isEmpty(incomingRequests)}" id="noIncoming">
                        <p style="color:#64748b;">No incoming requests.</p>
                    </div>
                    <div th:if="${incomingRequests != null && !#lists.isEmpty(incomingRequests)}" id="incomingList" style="display: flex; flex-direction: column; gap: 1rem;">
                        <div th:each="req : ${incomingRequests}" class="request-card">
                            <div class="request-header">
                                <strong th:text="${'From: ' + (req.requesterName ?: 'User')}"></strong>
                                <span th:if="${req.status != null}" th:class="'req-status-' + ${req.status.name().toLowerCase()}" th:text="${req.status}"></span>
                            </div>
                            <div style="font-size: 1.2rem; font-weight: bold; color: var(--primary); margin-bottom: 5px;" 
                                 th:text="${'$' + #numbers.formatDecimal(req.amount, 1, 2)}"></div>
                            <div style="color: #475569; font-size: 0.9rem; margin-bottom: 5px;" th:text="${req.purpose ?: 'No purpose provided'}"></div>
                            <div style="color: #94a3b8; font-size: 0.75rem;" th:text="${req.createdAt != null ? 'Requested on ' + #temporals.format(req.createdAt, 'MMM dd, yyyy HH:mm') : 'Request date unavailable'}"></div>
                            
                            <div th:if="${req.status != null && req.status.name() == 'PENDING'}" style="margin-top: 15px; display: flex; gap: 1rem;">
                                <button class="btn btn-primary" style="flex: 1; padding: 0.6rem; font-size: 0.9rem;" 
                                        th:data-req-id="${req.id}" th:data-req-amount="${req.amount}" th:data-req-name="${req.requesterName ?: 'User'}"
                                        onclick="openPinModal(this.getAttribute('data-req-id'), parseFloat(this.getAttribute('data-req-amount')), this.getAttribute('data-req-name'))">Pay Now</button>
                                <button class="btn" style="flex: 1; background: var(--danger-bg); color: var(--danger-text); border: 1px solid var(--danger-bg); padding: 0.6rem; font-size: 0.9rem;" 
                                        th:data-req-id="${req.id}" onclick="declineReq(this.getAttribute('data-req-id'))">Decline</button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Outgoing Requests -->
                <div class="card" style="padding: 1.5rem;">
                    <h3 style="font-size: 1.1rem; font-weight: 700; margin-bottom: 1rem; color: var(--text-main); display: flex; align-items: center; justify-content: space-between;">
                        Outgoing Requests
                        <span class="badge" style="background: #f1f5f9; color: #475569;">Sent</span>
                    </h3>
                    <div th:if="${outgoingRequests == null || #lists.isEmpty(outgoingRequests)}" id="noOutgoing">
                        <p style="color:#64748b;">No outgoing requests.</p>
                    </div>
                    <div th:if="${outgoingRequests != null && !#lists.isEmpty(outgoingRequests)}" id="outgoingList" style="display: flex; flex-direction: column; gap: 1rem;">
                        <div th:each="req : ${outgoingRequests}" class="request-card">
                            <div class="request-header">
                                <strong th:text="${'To: ' + (req.requesteeName ?: 'User')}"></strong>
                                <span th:if="${req.status != null}" th:class="'req-status-' + ${req.status.name().toLowerCase()}" th:text="${req.status}"></span>
                            </div>
                            <div style="font-size: 1.2rem; font-weight: bold; color: var(--primary); margin-bottom: 5px;" 
                                 th:text="${'$' + #numbers.formatDecimal(req.amount, 1, 2)}"></div>
                            <div style="color: #475569; font-size: 0.9rem; margin-bottom: 5px;" th:text="${req.purpose ?: 'No purpose provided'}"></div>
                            <div style="color: #94a3b8; font-size: 0.75rem;" th:text="${req.createdAt != null ? 'Requested on ' + #temporals.format(req.createdAt, 'MMM dd, yyyy HH:mm') : 'Request date unavailable'}"></div>
                            
                            <div th:if="${req.status != null && req.status.name() == 'PENDING'}" style="margin-top: 15px;">
                                <button class="btn btn-outline w-100" style="padding: 0.6rem; font-size: 0.9rem;" 
                                        th:data-req-id="${req.id}" onclick="cancelReq(this.getAttribute('data-req-id'))">Cancel Request</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

    <!-- PIN Modal -->
    <div id="pinModal" class="modal" style="display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); align-items: center; justify-content: center;">
        <div class="modal-content card" style="max-width: 400px; width: 90%; padding: 2.5rem; position: relative; margin: 0; box-shadow: var(--shadow-xl);">
            <h3 style="font-weight: 700; color: var(--text-main); margin-bottom: 0.5rem; text-align: center;">Enter PIN</h3>
            <p id="pinModalText" class="text-secondary" style="font-size: 0.95rem; margin-bottom: 1.5rem; text-align: center;"></p>
            
            <div class="form-group mb-4">
                <input type="password" id="acceptPin" placeholder="••••••" maxlength="6" style="text-align: center; font-size: 1.5rem; letter-spacing: 0.4em; padding: 1rem;">
            </div>
            
            <input type="hidden" id="acceptReqId">
            <input type="hidden" id="acceptReqAmount">
            <div id="pinError" class="alert alert-error" style="display:none; margin-bottom: 1rem;"></div>
            
            <div style="display: flex; flex-direction: column; gap: 0.75rem;">
                <button class="btn btn-primary w-100" id="btnPayWallet" onclick="confirmAccept()">Pay from Wallet</button>
                <button class="btn w-100" id="btnPayRzp" style="background-color: #3399cc; color: white; border: none;" onclick="payWithRazorpay()">Pay with Razorpay</button>
                <button class="btn w-100" onclick="closePinModal()" style="background: var(--bg-color); color: var(--text-main); border: 1px solid var(--border);">Cancel</button>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/layout :: footerFragment}"></div>

    <script th:inline="javascript">
        document.addEventListener('DOMContentLoaded', () => {
             // Initial render handled by Thymeleaf
        });

        const currentUserId = /*[[${session.user.id}]]*/ null;

        async function sendRequest() {
            const btn = document.querySelector('#reqForm button[type="submit"]');
            const msg = document.getElementById('reqMsg');

            setButtonLoading(btn, true, 'Sending Request...');
            msg.innerText = "";
            msg.style.color = "inherit";

            const identifier = document.getElementById('reqIdentifier').value;
            const amount = document.getElementById('reqAmount').value;
            const purpose = document.getElementById('reqPurpose').value;

            try {
                // 1. Resolve user ID by email/phone
                let targetRes = await fetchWithAuth(`/api/users/identifier?identifier=${encodeURIComponent(identifier)}`);
                if (!targetRes.ok) {
                    throw new Error("User not found with that email/phone.");
                }
                const targetUser = await targetRes.json();

                // 2. Send Request
                const payload = {
                    requesterId: currentUserId,
                    requesteeId: targetUser.id,
                    amount: parseFloat(amount),
                    purpose: purpose
                };

                const reqRes = await fetchWithAuth(`/api/money-requests/send`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (reqRes.ok) {
                    msg.innerText = "Request sent successfully!";
                    msg.style.color = "green";
                    document.getElementById('reqForm').reset();
                    loadOutgoing(); // Refresh list
                } else {
                    const data = await reqRes.json();
                    throw new Error(data.message || "Failed to send request.");
                }
            } catch (err) {
                msg.innerText = err.message;
                msg.style.color = "red";
            } finally {
                setButtonLoading(btn, false);
            }
        }

        async function loadIncoming() {
             window.location.reload();
        }

        async function loadOutgoing() {
             window.location.reload();
        }

        // Action Handlers
        function openPinModal(id, amount, requester) {
            document.getElementById('acceptReqId').value = id;
            document.getElementById('acceptReqAmount').value = amount;
            document.getElementById('pinModalText').innerText = `You are about to send $${amount.toFixed(2)} to ${requester}.`;
            document.getElementById('pinModal').style.display = 'flex';
            document.getElementById('pinError').style.display = 'none';
        }

        function closePinModal() {
            document.getElementById('pinModal').style.display = 'none';
            document.getElementById('acceptPin').value = '';
        }

        async function confirmAccept() {
            const reqId = document.getElementById('acceptReqId').value;
            const pin = document.getElementById('acceptPin').value;
            const errDiv = document.getElementById('pinError');
            const btn = document.getElementById('btnPayWallet');

            if (!pin) { errDiv.innerText = "PIN is required"; errDiv.style.display = 'block'; return; }

            setButtonLoading(btn, true, 'Processing Payment...');
            try {
                const res = await fetchWithAuth(`/api/money-requests/${reqId}/accept/user/${currentUserId}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ pin: pin })
                });

                if (res.ok) {
                    closePinModal();
                    alert("Payment sent successfully!");
                    loadIncoming();
                } else {
                    const data = await res.json();
                    throw new Error(data.message || "Payment failed");
                }
            } catch (e) {
                errDiv.innerText = e.message;
                errDiv.style.display = 'block';
            } finally {
                setButtonLoading(btn, false);
            }
        }

        async function payWithRazorpay() {
            const reqId = document.getElementById('acceptReqId').value;
            const pin = document.getElementById('acceptPin').value;
            const amount = document.getElementById('acceptReqAmount').value;
            const errDiv = document.getElementById('pinError');
            const btn = document.getElementById('btnPayRzp');

            if (!pin) { errDiv.innerText = "PIN is required"; errDiv.style.display = 'block'; return; }

            setButtonLoading(btn, true, 'Processing...');
            errDiv.style.display = 'none';

            try {
                // 1. Create order on the server
                const orderRes = await fetchWithAuth(`/api/payment/create-order`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ amount: amount, currency: 'USD' })
                });

                const orderData = await orderRes.json();
                if (!orderData || !orderData.orderId) {
                    throw new Error(orderData.message || "Failed to create order");
                }

                // 2. Initialize Razorpay Checkout
                const options = {
                    "key": orderData.keyId,
                    "amount": orderData.amount,
                    "currency": orderData.currency,
                    "name": "RevPay",
                    "description": "Fulfill Money Request",
                    "order_id": orderData.orderId,
                    "handler": function (response) {
                        // 3. Verify Payment and Accept Request
                        verifyAndAcceptRazorpayPayment(response, amount, reqId, currentUserId, pin, btn, errDiv);
                    },
                    "modal": {
                        "ondismiss": function () {
                            setButtonLoading(btn, false);
                        }
                    },
                    "prefill": {
                        "name": "User", // Could use more Thymeleaf here if needed
                        "email": "user@example.com"
                    },
                    "theme": { "color": "#3399cc" }
                };
                const rzp = new Razorpay(options);
                rzp.on('payment.failed', function (response) {
                    errDiv.innerText = "Payment failed: " + response.error.description;
                    errDiv.style.display = "block";
                    setButtonLoading(btn, false);
                });
                rzp.open();

            } catch (err) {
                console.error(err);
                errDiv.innerText = err.message || "Error creating Razorpay order";
                errDiv.style.display = "block";
                setButtonLoading(btn, false);
            }
        }

        async function verifyAndAcceptRazorpayPayment(paymentResponse, amount, reqId, userId, pin, btn, errDiv) {
            setButtonLoading(btn, true, 'Verifying...');

            try {
                const payload = {
                    userId: userId,
                    amount: amount,
                    razorpayPaymentId: paymentResponse.razorpay_payment_id,
                    razorpayOrderId: paymentResponse.razorpay_order_id,
                    razorpaySignature: paymentResponse.razorpay_signature,
                    moneyRequestId: reqId,
                    transactionPin: pin
                };

                const res = await fetchWithAuth(`/api/payment/verify-and-accept`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (res.ok) {
                    closePinModal();
                    alert("Payment sent successfully via Razorpay!");
                    loadIncoming();
                } else {
                    const err = await res.json();
                    throw new Error(err.error || err.message || "Payment verification failed");
                }
            } catch (err) {
                errDiv.innerText = err.message;
                errDiv.style.display = "block";
            } finally {
                setButtonLoading(btn, false);
            }
        }

        async function declineReq(id) {
            if (!confirm("Decline this request?")) return;
            await fetchWithAuth(`/api/money-requests/${id}/decline/user/${currentUserId}`, { method: 'POST' });
            loadIncoming();
        }

        async function cancelReq(id) {
            if (!confirm("Cancel this outgoing request?")) return;
            await fetchWithAuth(`/api/money-requests/${id}/cancel/user/${currentUserId}`, { method: 'POST' });
            loadOutgoing();
        }
    </script>
</body>

</html>

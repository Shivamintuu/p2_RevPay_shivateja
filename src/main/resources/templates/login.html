<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <div th:replace="~{fragments/layout :: headFragment('Login - RevPay')}"></div>
</head>

<body>
    <div th:replace="~{fragments/layout :: headerFragment}"></div>

    <div style="min-height: calc(100vh - 80px); display: flex; align-items: center; justify-content: center; padding: 2rem;">
        <div class="card" style="width: 100%; max-width: 440px; padding: 2.5rem 2rem;">
            <div class="text-center mb-4">
                <h2 style="font-weight: 800; color: var(--text-main); margin-bottom: 0.5rem; font-size: 1.75rem;">Welcome Back</h2>
                <p class="text-secondary" style="font-size: 0.95rem;">Please enter your details to sign in.</p>
            </div>

            <!-- UI form that JS will intercept -->
            <form id="loginForm" onsubmit="event.preventDefault(); submitLogin();">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required placeholder="Enter your email">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required placeholder="••••••••">
                </div>

                <div id="errorMessage" class="alert alert-error" style="display:none; margin-bottom: 1.25rem;"></div>

                <button type="submit" class="btn btn-primary" style="width: 100%; margin-bottom: 1.25rem; padding: 0.8rem;">
                    Sign In
                </button>

                <div class="text-center" style="margin-bottom: 1.5rem;">
                    <a href="#" onclick="showForgotPasswordForm()" style="font-size: 0.9rem; font-weight: 500;">Forgot Password?</a>
                </div>
            </form>

            <form id="otpForm" onsubmit="event.preventDefault(); submitOtp();" style="display:none;">
                <div class="form-group">
                    <label for="otp">Enter 6-digit OTP</label>
                    <input type="text" id="otp" name="otp" required placeholder="123456" style="text-align: center; font-size: 1.5rem; letter-spacing: 0.2em;">
                </div>

                <div id="otpErrorMessage" class="alert alert-error" style="display:none; margin-bottom: 1.25rem;"></div>

                <button type="submit" class="btn btn-primary" style="width: 100%; margin-bottom: 1.25rem; padding: 0.8rem;">
                    Verify OTP
                </button>

                <div class="text-center">
                    <a href="#" onclick="resendOtp()" style="font-size: 0.9rem; color: var(--text-secondary); font-weight: 500;">
                        Didn't receive it? <span style="color: var(--primary);">Resend OTP</span>
                    </a>
                </div>
            </form>

            <form id="forgotPasswordForm" onsubmit="event.preventDefault(); submitForgotPassword();" style="display:none;">
                <p class="text-center text-secondary mb-3" style="font-size: 0.9rem;">
                    Enter your email to receive a password reset OTP.
                </p>
                <div class="form-group">
                    <label for="resetEmail">Email</label>
                    <input type="email" id="resetEmail" name="resetEmail" required placeholder="name@example.com">
                </div>
                <div id="forgotErrorMessage" class="alert alert-error" style="display:none; margin-bottom: 1.25rem;"></div>
                
                <button type="submit" class="btn btn-primary" style="width: 100%; margin-bottom: 1.25rem; padding: 0.8rem;">
                    Send Reset OTP
                </button>
                
                <div class="text-center">
                    <a href="#" onclick="showLoginForm()" style="font-size: 0.9rem; color: var(--text-secondary); font-weight: 500;">
                        ← Back to Login
                    </a>
                </div>
            </form>

            <form id="resetPasswordForm" onsubmit="event.preventDefault(); submitResetPassword();" style="display:none;">
                <div class="form-group">
                    <label for="resetOtp">Enter Reset OTP</label>
                    <input type="text" id="resetOtp" name="resetOtp" required style="text-align: center; font-size: 1.5rem; letter-spacing: 0.2em;">
                </div>
                <div class="form-group">
                    <label for="newPassword">New Password</label>
                    <input type="password" id="newPassword" name="newPassword" required placeholder="••••••••">
                </div>
                
                <div id="resetErrorMessage" class="alert alert-error" style="display:none; margin-bottom: 1.25rem;"></div>
                
                <button type="submit" class="btn" style="background-color: var(--success); color: white; width: 100%; margin-bottom: 1.25rem; padding: 0.8rem;">
                    Confirm New Password
                </button>
            </form>

            <p id="registerText" class="text-center border-t mt-4 pt-4" style="font-size: 0.95rem; color: var(--text-secondary); border-top: 1px solid var(--border); padding-top: 1.25rem;">
                Don't have an account? <a th:href="@{/register}" style="font-weight: 600;">Register here</a>
            </p>
        </div>
    </div>

    <div th:replace="~{fragments/layout :: footerFragment}"></div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const autoLoginEmail = sessionStorage.getItem('autoLoginEmail');
            const autoLoginPassword = sessionStorage.getItem('autoLoginPassword');
            
            if (autoLoginEmail && autoLoginPassword) {
                document.getElementById("email").value = autoLoginEmail;
                document.getElementById("password").value = autoLoginPassword;
                sessionStorage.removeItem('autoLoginEmail');
                sessionStorage.removeItem('autoLoginPassword');
                submitLogin();
            }
        });

        async function submitLogin() {
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;
            const btn = document.querySelector('#loginForm button[type="submit"]');

            setButtonLoading(btn, true, 'Logging in...');
            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email, password: password })
                });

                if (!response.ok) {
                    let errMsg = 'Invalid credentials';
                    try {
                        const errData = await response.json();
                        errMsg = errData.message || errMsg;
                    } catch (e) { }
                    throw new Error(errMsg);
                }

                const data = await response.json();
                if (data.requiresOtp) {
                    document.getElementById("loginForm").style.display = "none";
                    document.getElementById("otpForm").style.display = "block";
                    const errorDiv = document.getElementById("errorMessage");
                    errorDiv.style.display = "none";
                    const successDiv = document.createElement('div');
                    successDiv.style.color = 'green';
                    successDiv.style.marginBottom = '15px';
                    successDiv.innerText = data.message || "OTP sent to your email.";
                    document.getElementById("otpForm").prepend(successDiv);
                } else if (data.token && data.user) {
                    handleLoginSuccess(data.user, data.token);
                }
            } catch (error) {
                const errorDiv = document.getElementById("errorMessage");
                errorDiv.innerText = error.message;
                errorDiv.style.display = "block";
            } finally {
                setButtonLoading(btn, false);
            }
        }

        async function submitOtp() {
            const email = document.getElementById("email").value;
            const otp = document.getElementById("otp").value;
            const btn = document.querySelector('#otpForm button[type="submit"]');

            setButtonLoading(btn, true, 'Verifying...');
            try {
                const response = await fetch('/api/auth/verify-otp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email, otp: otp })
                });

                if (!response.ok) {
                    const errData = await response.json();
                    throw new Error(errData.message || 'Invalid or expired OTP');
                }

                const data = await response.json();
                if (data.token && data.user) {
                    handleLoginSuccess(data.user, data.token);
                }
            } catch (error) {
                const errorDiv = document.getElementById("otpErrorMessage");
                errorDiv.innerText = error.message;
                errorDiv.style.display = "block";
            } finally {
                setButtonLoading(btn, false);
            }
        }

        async function resendOtp() {
            const email = document.getElementById("email").value || document.getElementById("resetEmail").value;
            const btn = document.querySelector('#otpForm a[onclick="resendOtp()"]');

            if (btn) btn.innerText = "Resending OTP...";

            try {
                const response = await fetch('/api/auth/resend-otp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email })
                });
                const data = await response.json();
                alert(data.message || 'OTP Resent Successfully.');
            } catch (err) {
                alert('Failed to resend OTP.');
            } finally {
                if (btn) btn.innerText = "Didn't receive it? Resend OTP";
            }
        }

        function showForgotPasswordForm() {
            document.getElementById("loginForm").style.display = "none";
            document.getElementById("otpForm").style.display = "none";
            document.getElementById("resetPasswordForm").style.display = "none";
            document.getElementById("forgotPasswordForm").style.display = "block";
            document.getElementById("registerText").style.display = "none";
        }

        function showLoginForm() {
            document.getElementById("forgotPasswordForm").style.display = "none";
            document.getElementById("resetPasswordForm").style.display = "none";
            document.getElementById("otpForm").style.display = "none";
            document.getElementById("loginForm").style.display = "block";
            document.getElementById("registerText").style.display = "block";
        }

        async function submitForgotPassword() {
            const email = document.getElementById("resetEmail").value;
            const btn = document.querySelector('#forgotPasswordForm button[type="submit"]');

            setButtonLoading(btn, true, 'Sending email...');
            try {
                const response = await fetch('/api/auth/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email })
                });
                const data = await response.json();
                alert(data.message);
                document.getElementById("forgotPasswordForm").style.display = "none";
                document.getElementById("resetPasswordForm").style.display = "block";
            } catch (err) {
                const errorDiv = document.getElementById("forgotErrorMessage");
                errorDiv.innerText = "Error requesting password reset.";
                errorDiv.style.display = "block";
            } finally {
                setButtonLoading(btn, false);
            }
        }

        async function submitResetPassword() {
            const email = document.getElementById("resetEmail").value;
            const otp = document.getElementById("resetOtp").value;
            const newPassword = document.getElementById("newPassword").value;
            const btn = document.querySelector('#resetPasswordForm button[type="submit"]');

            setButtonLoading(btn, true, 'Resetting...');
            try {
                const response = await fetch('/api/auth/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email, otp: otp, newPassword: newPassword })
                });

                if (!response.ok) throw new Error("Invalid OTP or Password Reset Failed");

                const data = await response.json();
                alert(data.message);
                showLoginForm();
            } catch (err) {
                const errorDiv = document.getElementById("resetErrorMessage");
                errorDiv.innerText = err.message;
                errorDiv.style.display = "block";
            } finally {
                setButtonLoading(btn, false);
            }
        }
    </script>
</body>

</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <div th:replace="~{fragments/layout :: headFragment('Login - RevPay')}"></div>
</head>

<body>
    <div th:replace="~{fragments/layout :: headerFragment}"></div>

    <div class="container" style="max-width: 400px; margin: 50px auto;">
        <h2>Login to your account</h2>

        <!-- UI form that JS will intercept -->
        <form id="loginForm" onsubmit="event.preventDefault(); submitLogin();">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>

            <div id="errorMessage" class="error" style="display:none; margin-bottom: 10px;"></div>

            <button type="submit" class="btn" style="width: 100%; margin-bottom: 15px;">Login</button>
            
            <div style="text-align: right;">
                <a href="#" onclick="showForgotPasswordForm()" style="font-size: 0.85rem; color: var(--primary-color);">Forgot Password?</a>
            </div>
        </form>

        <form id="otpForm" onsubmit="event.preventDefault(); submitOtp();" style="display:none;">
            <div class="form-group">
                <label for="otp">Enter OTP</label>
                <input type="text" id="otp" name="otp" required>
            </div>

            <div id="otpErrorMessage" class="error" style="display:none; margin-bottom: 10px;"></div>

            <button type="submit" class="btn" style="width: 100%; margin-bottom: 15px;">Verify OTP</button>

            <div style="text-align: center;">
                <a href="#" onclick="resendOtp()" style="font-size: 0.85rem; color: var(--primary-color);">Didn't receive it? Resend OTP</a>
            </div>
        </form>

        <form id="forgotPasswordForm" onsubmit="event.preventDefault(); submitForgotPassword();" style="display:none;">
            <p style="font-size: 0.9rem; color: var(--text-secondary); margin-bottom: 15px;">Enter your email to receive a password reset OTP.</p>
            <div class="form-group">
                <label for="resetEmail">Email</label>
                <input type="email" id="resetEmail" name="resetEmail" required>
            </div>
            <div id="forgotErrorMessage" class="error" style="display:none; margin-bottom: 10px;"></div>
            <button type="submit" class="btn btn-warning" style="width: 100%; margin-bottom: 15px;">Send Reset OTP</button>
            <div style="text-align: center;">
                <a href="#" onclick="showLoginForm()" style="font-size: 0.85rem; color: var(--text-secondary);">Back to Login</a>
            </div>
        </form>

        <form id="resetPasswordForm" onsubmit="event.preventDefault(); submitResetPassword();" style="display:none;">
            <div class="form-group">
                <label for="resetOtp">Enter Reset OTP</label>
                <input type="text" id="resetOtp" name="resetOtp" required>
            </div>
            <div class="form-group">
                <label for="newPassword">New Password</label>
                <input type="password" id="newPassword" name="newPassword" required>
            </div>
            <div id="resetErrorMessage" class="error" style="display:none; margin-bottom: 10px;"></div>
            <button type="submit" class="btn btn-success" style="width: 100%; margin-bottom: 15px;">Confirm New Password</button>
        </form>

        <p id="registerText" style="text-align: center; margin-top: 15px;">
            Don't have an account? <a th:href="@{/register}">Register here</a>.
        </p>
    </div>

    <div th:replace="~{fragments/layout :: footerFragment}"></div>

    <script>
        function submitLogin() {
            if (!validateLoginForm()) return;

            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;

            // Call REST API
            fetch('/api/auth/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ email: email, password: password })
            })
                .then(response => {
                    if (response.ok) {
                        return response.json();
                    } else {
                        throw new Error('Invalid credentials');
                    }
                })
                .then(data => {
                    if (data.requiresOtp) {
                        document.getElementById("loginForm").style.display = "none";
                        document.getElementById("otpForm").style.display = "block";
                        const errorDiv = document.getElementById("errorMessage");
                        errorDiv.style.display = "none"; // Hide previous errors
                        const successDiv = document.createElement('div');
                        successDiv.style.color = 'green';
                        successDiv.style.marginBottom = '15px';
                        successDiv.innerText = data.message || "OTP sent to your email.";
                        document.getElementById("otpForm").prepend(successDiv);
                    } else if (data.token && data.user) {
                        handleLoginSuccess(data.user, data.token);
                    }
                })
                .catch(error => {
                    const errorDiv = document.getElementById("errorMessage");
                    errorDiv.innerText = error.message;
                    errorDiv.style.display = "block";
                });
        }

        function submitOtp() {
            const email = document.getElementById("email").value;
            const otp = document.getElementById("otp").value;

            fetch('/api/auth/verify-otp', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ email: email, otp: otp })
            })
                .then(response => {
                    if (response.ok) {
                        return response.json();
                    } else {
                        return response.json().then(errData => {
                            throw new Error(errData.message || 'Invalid or expired OTP');
                        });
                    }
                })
                .then(data => {
                    if (data.token && data.user) {
                        handleLoginSuccess(data.user, data.token);
                    }
                })
                .catch(error => {
                    const errorDiv = document.getElementById("otpErrorMessage");
                    errorDiv.innerText = error.message;
                    errorDiv.style.display = "block";
                });
        }

        function resendOtp() {
            const email = document.getElementById("email").value || document.getElementById("resetEmail").value;
            fetch('/api/auth/resend-otp', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: email })
            })
            .then(res => res.json())
            .then(data => alert(data.message || 'OTP Resent Successfully.'))
            .catch(err => alert('Failed to resend OTP.'));
        }

        function showForgotPasswordForm() {
            document.getElementById("loginForm").style.display = "none";
            document.getElementById("otpForm").style.display = "none";
            document.getElementById("resetPasswordForm").style.display = "none";
            document.getElementById("forgotPasswordForm").style.display = "block";
            document.getElementById("registerText").style.display = "none";
        }

        function showLoginForm() {
            document.getElementById("forgotPasswordForm").style.display = "none";
            document.getElementById("resetPasswordForm").style.display = "none";
            document.getElementById("otpForm").style.display = "none";
            document.getElementById("loginForm").style.display = "block";
            document.getElementById("registerText").style.display = "block";
        }

        function submitForgotPassword() {
            const email = document.getElementById("resetEmail").value;
            fetch('/api/auth/forgot-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: email })
            })
            .then(res => res.json())
            .then(data => {
                alert(data.message);
                document.getElementById("forgotPasswordForm").style.display = "none";
                document.getElementById("resetPasswordForm").style.display = "block";
            })
            .catch(err => {
                const errorDiv = document.getElementById("forgotErrorMessage");
                errorDiv.innerText = "Error requesting password reset.";
                errorDiv.style.display = "block";
            });
        }

        function submitResetPassword() {
            const email = document.getElementById("resetEmail").value;
            const otp = document.getElementById("resetOtp").value;
            const newPassword = document.getElementById("newPassword").value;

            fetch('/api/auth/reset-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: email, otp: otp, newPassword: newPassword })
            })
            .then(response => {
                if(response.ok) return response.json();
                throw new Error("Invalid OTP or Password Reset Failed");
            })
            .then(data => {
                alert(data.message);
                showLoginForm();
            })
            .catch(err => {
                const errorDiv = document.getElementById("resetErrorMessage");
                errorDiv.innerText = err.message;
                errorDiv.style.display = "block";
            });
        }
    </script>
</body>

</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <div th:replace="~{fragments/layout :: headFragment('Loan Status - RevPay')}"></div>
    <style>
        .loan-status-pending {
            background: #fef08a;
            color: #854d0e;
        }

        .loan-status-approved {
            background: #dcfce7;
            color: #166534;
        }

        .loan-status-rejected {
            background: #fee2e2;
            color: #991b1b;
        }

        .loan-status-paid {
            background: #dbeafe;
            color: #1e40af;
        }
    </style>
</head>

<body>
    <div th:replace="~{fragments/layout :: headerFragment}"></div>

    <div class="main-content">
        <h2 style="display: flex; justify-content: space-between; align-items: center;">
            My Loan Applications
            <a href="/loan/apply" class="btn">+ Apply for New Loan</a>
        </h2>

        <div class="card" style="padding: 20px;">
            <div th:if="${#lists.isEmpty(loans)}" style="text-align:center; padding: 20px;">
                No loan applications found.
            </div>

            <div th:if="${!#lists.isEmpty(loans)}" id="loanContainer" style="overflow-x: auto;">
                <table style="width: 100%; border-collapse: collapse; text-align: left;">
                    <thead>
                        <tr style="border-bottom: 2px solid #e2e8f0; color: #64748b; font-size: 0.85rem; text-transform: uppercase;">
                            <th style="padding: 15px 10px;">ID</th>
                            <th style="padding: 15px 10px;">Date Applied</th>
                            <th style="padding: 15px 10px;">Amount & Tenure</th>
                            <th style="padding: 15px 10px;">Interest & EMI</th>
                            <th style="padding: 15px 10px;">Status</th>
                        </tr>
                    </thead>
                    <tbody id="loanBody">
                        <tr th:each="loan : ${loans}" style="border-bottom: 1px solid #f1f5f9;">
                            <td style="padding: 15px 10px; font-weight: bold; color: #64748b;" th:text="${'#LOAN-' + loan.id}"></td>
                            <td style="padding: 15px 10px;" th:text="${#temporals.format(loan.appliedAt, 'MMM dd, yyyy')}"></td>
                            <td style="padding: 15px 10px;">
                                <div style="font-weight: 500;" th:text="${'$' + #numbers.formatDecimal(loan.amount, 1, 2)}"></div>
                                <div style="font-size: 0.8rem; color: #64748b;" th:text="${loan.tenureMonths + ' Months'}"></div>
                            </td>
                            <td style="padding: 15px 10px;">
                                <div><strong style="color:var(--primary-color)" th:text="${'$' + (loan.emi != null ? #numbers.formatDecimal(loan.emi, 1, 2) : '0.00') + '/mo'}"></strong></div>
                                <div style="font-size: 0.8rem; color: #64748b;" th:text="${'@ ' + loan.interestRate + '% P.A.'}"></div>
                            </td>
                            <td style="padding: 15px 10px;">
                                <span th:class="'loan-status-' + ${loan.status.name().toLowerCase()}" 
                                      style="padding: 4px 10px; border-radius: 12px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase;"
                                      th:text="${loan.status}">
                                </span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div id="errorMsg" class="error" style="display:none; margin-top: 15px;"></div>
        </div>
    </div>

    <div th:replace="~{fragments/layout :: footerFragment}"></div>

    <script th:inline="javascript">
        document.addEventListener('DOMContentLoaded', () => {
             // Initial render handled by Thymeleaf
        });
    </script>
</body>

</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <div th:replace="~{fragments/layout :: headFragment('Settings - RevPay')}"></div>
</head>

<body>
    <div th:replace="~{fragments/layout :: headerFragment}"></div>

    <div class="main-content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 style="font-size: 2rem; font-weight: 800; letter-spacing: -0.5px; margin: 0;">Account Settings</h1>
        </div>

        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 1.5rem; align-items: start;">
            <!-- Profile Update Section -->
            <div class="card" style="padding: 2rem;">
                <h3 style="font-size: 1.25rem; font-weight: 700; margin-bottom: 1.5rem; color: var(--text-main);">Profile Information</h3>
                <form id="profileForm" onsubmit="event.preventDefault(); updateProfile();">
                    <div class="form-group">
                        <label for="profFullName">Full Name</label>
                        <input type="text" id="profFullName" th:value="${user.fullName}" required>
                    </div>
                    <div class="form-group">
                        <label for="profPhone">Phone Number</label>
                        <input type="text" id="profPhone" th:value="${user.phoneNumber}" required>
                    </div>
                    <div class="form-group mb-4">
                        <label for="profSecurityQuestion">Security Question</label>
                        <input type="text" id="profSecurityQuestion" th:value="${user.securityQuestion}" required disabled
                            style="background: var(--bg-color); cursor: not-allowed; opacity: 0.7;">
                        <small class="text-secondary mt-1 d-block">Security Question cannot be changed for security reasons.</small>
                    </div>

                    <!-- Business Specific Updates -->
                    <div id="businessUpdateFields"
                        th:style="${user.role.name() == 'BUSINESS' ? 'display:block; padding-top: 1.5rem; border-top: 1px solid var(--border); margin-top: 1.5rem;' : 'display:none;'}">
                        <h4 style="font-size: 1.1rem; font-weight: 600; margin-bottom: 1rem;">Business Details</h4>
                        <div class="form-group">
                            <label for="profBusinessName">Business Name</label>
                            <input type="text" id="profBusinessName" th:value="${user.businessName}" th:required="${user.role.name() == 'BUSINESS'}">
                        </div>
                        <div class="form-group">
                            <label for="profBusinessType">Business Type</label>
                            <input type="text" id="profBusinessType" th:value="${user.businessType}">
                        </div>
                        <div class="form-group">
                            <label for="profTaxId">Tax ID</label>
                            <input type="text" id="profTaxId" th:value="${user.taxId}" th:required="${user.role.name() == 'BUSINESS'}">
                        </div>
                        <div class="form-group mb-4">
                            <label for="profBusinessAddress">Business Address</label>
                            <textarea id="profBusinessAddress" rows="2" placeholder="Full address string..." th:text="${user.businessAddress}"></textarea>
                        </div>
                    </div>

                    <div id="profileMsg" class="alert mb-3" style="display: none;"></div>
                    <button type="submit" class="btn btn-primary w-100 p-3">Update Profile</button>
                </form>
            </div>

            <!-- Security Section -->
            <div style="display: flex; flex-direction: column; gap: 1.5rem;">
                <!-- Password Change -->
                <div class="card" style="padding: 2rem;">
                    <h3 style="font-size: 1.25rem; font-weight: 700; margin-bottom: 1.5rem; color: var(--text-main);">Change Password</h3>
                    <form id="passwordForm" onsubmit="event.preventDefault(); updatePassword();">
                        <div class="form-group">
                            <label for="currentPassword">Current Password</label>
                            <input type="password" id="currentPassword" required>
                        </div>
                        <div class="form-group mb-4">
                            <label for="newPassword">New Password</label>
                            <input type="password" id="newPassword" required>
                        </div>
                        <div id="passMsg" class="alert mb-3" style="display: none;"></div>
                        <button type="submit" class="btn btn-primary w-100 p-3">Update Password</button>
                    </form>
                </div>

                <!-- PIN Change -->
                <div class="card" style="padding: 2rem;">
                    <h3 style="font-size: 1.25rem; font-weight: 700; margin-bottom: 1.5rem; color: var(--text-main);">Transaction PIN</h3>
                    <form id="pinForm" onsubmit="event.preventDefault(); updatePin();">
                        <div class="form-group mb-4">
                            <label for="newPin">Set/Update 6-digit PIN</label>
                            <input type="password" id="newPin" required maxlength="6" pattern="\d{6}" placeholder="••••••" style="letter-spacing: 0.2em; text-align: center; font-size: 1.25rem;">
                        </div>
                        <div id="pinMsg" class="alert mb-3" style="display: none;"></div>
                        <button type="submit" class="btn btn-primary w-100 p-3">Update PIN</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/layout :: footerFragment}"></div>

    <script th:inline="javascript">
        const currentUserId = /*[[${session.user.id}]]*/ null;

        document.addEventListener('DOMContentLoaded', async () => {
             // Initial data handled by Thymeleaf
        });

        async function updateProfile() {
            const msg = document.getElementById('profileMsg');
            const btn = document.querySelector('#profileForm button[type="submit"]');
            const userStr = sessionStorage.getItem('user');
            if (!userStr) return;
            let user = JSON.parse(userStr);

            user.fullName = document.getElementById('profFullName').value;
            user.phoneNumber = document.getElementById('profPhone').value;

            if (user.role === 'BUSINESS') {
                user.businessName = document.getElementById('profBusinessName').value;
                user.businessType = document.getElementById('profBusinessType').value;
                user.taxId = document.getElementById('profTaxId').value;
                user.businessAddress = document.getElementById('profBusinessAddress').value;
            }

            setButtonLoading(btn, true, 'Updating Profile...');
            try {
                const response = await fetchWithAuth(`/api/users/${currentUserId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(user)
                });

                if (response.ok) {
                    const updatedUser = await response.json();
                    // Update sessionStorage user if needed for other client-side logic
                    sessionStorage.setItem('user', JSON.stringify(updatedUser));
                    msg.innerText = "Profile updated successfully!";
                    msg.style.color = 'green';
                } else {
                    const data = await response.json();
                    throw new Error(data.message || "Failed to update profile");
                }
            } catch (err) {
                msg.innerText = err.message;
                msg.style.color = 'red';
            } finally {
                setButtonLoading(btn, false);
            }
        }

        async function updatePassword() {
            const currentPassword = document.getElementById('currentPassword').value;
            const newPassword = document.getElementById('newPassword').value;
            const msg = document.getElementById('passMsg');
            const btn = document.querySelector('#passwordForm button[type="submit"]');

            setButtonLoading(btn, true, 'Updating Password...');
            try {
                const response = await fetchWithAuth(`/api/users/${currentUserId}/password`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ currentPassword, newPassword })
                });

                if (response.ok) {
                    msg.innerText = "Password updated successfully!";
                    msg.style.color = 'green';
                    document.getElementById('passwordForm').reset();
                } else {
                    const data = await response.json();
                    throw new Error(data.message || "Failed to update password");
                }
            } catch (err) {
                msg.innerText = err.message;
                msg.style.color = 'red';
            } finally {
                setButtonLoading(btn, false);
            }
        }

        async function updatePin() {
            const newPin = document.getElementById('newPin').value;
            const msg = document.getElementById('pinMsg');
            const btn = document.querySelector('#pinForm button[type="submit"]');
            setButtonLoading(btn, true, 'Updating PIN...');
            try {
                const response = await fetchWithAuth(`/api/users/${currentUserId}/pin`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ newPin: newPin })
                });

                if (response.ok) {
                    msg.innerText = "PIN updated successfully!";
                    msg.style.color = 'green';
                    document.getElementById('pinForm').reset();
                } else {
                    const data = await response.json();
                    throw new Error(data.message || "Failed to update PIN");
                }
            } catch (err) {
                msg.innerText = err.message;
                msg.style.color = 'red';
            } finally {
                setButtonLoading(btn, false);
            }
        }
    </script>
</body>

</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <div th:replace="~{fragments/layout :: headFragment('Transactions - RevPay')}"></div>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th,
        td {
            padding: 10px;
            border: 1px solid #ddd;
            text-align: left;
        }

        th {
            background-color: #f4f4f4;
        }
    </style>
</head>

<body>
    <div th:replace="~{fragments/layout :: headerFragment}"></div>
    <div class="main-content">
        <h2>Transaction History</h2>

        <div class="card" style="margin-bottom: 20px;">
            <div style="display: flex; flex-wrap: wrap; gap: 15px; align-items: flex-end;">
                <div class="form-group" style="margin-bottom: 0;">
                    <label for="searchQuery">Search</label>
                    <input type="text" id="searchQuery" placeholder="Name, ID, Note...">
                </div>
                <div class="form-group" style="margin-bottom: 0;">
                    <label for="filterType">Type</label>
                    <select id="filterType">
                        <option value="">All</option>
                        <option value="SEND">Send</option>
                        <option value="REQUEST_PAYMENT">Request Payment</option>
                    </select>
                </div>
                <div class="form-group" style="margin-bottom: 0;">
                    <label for="filterStatus">Status</label>
                    <select id="filterStatus">
                        <option value="">All</option>
                        <option value="COMPLETED">Completed</option>
                        <option value="PENDING">Pending</option>
                        <option value="FAILED">Failed</option>
                    </select>
                </div>
                <div class="form-group" style="margin-bottom: 0;">
                    <label for="startDate">Start Date</label>
                    <input type="date" id="startDate">
                </div>
                <div class="form-group" style="margin-bottom: 0;">
                    <label for="endDate">End Date</label>
                    <input type="date" id="endDate">
                </div>
                <button class="btn" style="height: 40px;" onclick="applyFilters()">Apply Filters</button>
                <button class="btn" style="height: 40px; background-color: #28a745;" onclick="exportCSV()">Export
                    CSV</button>
            </div>
        </div>

        <div class="card">
            <table id="transactionsTable">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Date</th>
                        <th>Type</th>
                        <th>Amount</th>
                        <th>Status</th>
                        <th>Sender</th>
                        <th>Recipient</th>
                        <th>Note</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Populated via JS -->
                </tbody>
            </table>
        </div>
    </div>

    <div style="clear: both;"></div>
    <div th:replace="~{fragments/layout :: footerFragment}"></div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            if (!sessionStorage.getItem('jwtToken') || !sessionStorage.getItem('userId')) {
                window.location.href = "/login";
                return;
            }
            loadTransactions();
        });

        let allTransactions = [];

        function loadTransactions() {
            const userId = sessionStorage.getItem('userId');
            fetchWithAuth(`/api/transactions/user/${userId}`)
                .then(res => res.json())
                .then(data => {
                    allTransactions = data || [];
                    renderTable(allTransactions);
                });
        }

        function renderTable(transactions) {
            const tbody = document.querySelector('#transactionsTable tbody');
            tbody.innerHTML = '';

            transactions.forEach(tx => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${tx.id}</td>
                    <td>${new Date(tx.timestamp).toLocaleString()}</td>
                    <td>${tx.type}</td>
                    <td>$${tx.amount.toFixed(2)}</td>
                    <td>${tx.status}</td>
                    <td>${tx.senderName || 'N/A'}</td>
                    <td>${tx.recipientName || 'N/A'}</td>
                    <td>${tx.note || ''}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function applyFilters() {
            const query = document.getElementById('searchQuery').value.toLowerCase();
            const type = document.getElementById('filterType').value;
            const status = document.getElementById('filterStatus').value;
            const startDate = document.getElementById('startDate').value;
            const endDate = document.getElementById('endDate').value;

            const filtered = allTransactions.filter(tx => {
                // Search query matching
                let matchesQuery = true;
                if (query) {
                    const searchString = `${tx.id} ${tx.senderName || ''} ${tx.recipientName || ''} ${tx.note || ''}`.toLowerCase();
                    matchesQuery = searchString.includes(query);
                }

                const matchesType = type ? tx.type === type : true;
                const matchesStatus = status ? tx.status === status : true;

                // Date filtering
                let matchesDate = true;
                if (startDate || endDate) {
                    const txDate = new Date(tx.timestamp);
                    if (startDate) {
                        const start = new Date(startDate);
                        start.setHours(0, 0, 0, 0);
                        if (txDate < start) matchesDate = false;
                    }
                    if (endDate) {
                        const end = new Date(endDate);
                        end.setHours(23, 59, 59, 999);
                        if (txDate > end) matchesDate = false;
                    }
                }

                return matchesQuery && matchesType && matchesStatus && matchesDate;
            });

            renderTable(filtered);
        }

        function exportCSV() {
            const userId = sessionStorage.getItem('userId');
            const token = sessionStorage.getItem('token');
            const url = `/api/transactions/user/${userId}/export/csv`;

            fetch(url, {
                headers: {
                    'Authorization': 'Bearer ' + token
                }
            })
                .then(response => {
                    if (!response.ok) throw new Error("Export failed");
                    return response.blob();
                })
                .then(blob => {
                    const downloadUrl = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = downloadUrl;
                    a.download = "transactions.csv";
                    document.body.appendChild(a);
                    a.click();
                    a.remove();
                    window.URL.revokeObjectURL(downloadUrl);
                })
                .catch(err => alert(err.message));
        }
    </script>
</body>

</html>

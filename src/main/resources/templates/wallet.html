<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <div th:replace="~{fragments/layout :: headFragment('My Wallet - RevPay')}"></div>
</head>

<body>
    <div th:replace="~{fragments/layout :: headerFragment}"></div>
    <div class="main-content">
        <h2>My Wallet</h2>

        <div class="card" style="margin-bottom: 20px;">
            <h3>Current Balance: <span id="walletBalance" style="color: #28a745;">$0.00</span></h3>
        </div>

        <div style="display: flex; gap: 20px;">
            <!-- Add Funds Form -->
            <div class="card" style="flex:1;">
                <h3>Add Funds</h3>
                <form id="addFundsForm" onsubmit="event.preventDefault(); addFunds();">
                    <div class="form-group">
                        <label for="addPaymentMethod">Payment Method</label>
                        <select id="addPaymentMethod" required>
                            <option value="" disabled selected>Select a mapped card</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="addAmount">Amount ($)</label>
                        <input type="number" step="0.01" id="addAmount" required>
                    </div>
                    <div class="form-group">
                        <label for="addPin">Transaction PIN</label>
                        <input type="password" id="addPin" required>
                    </div>
                    <button type="submit" class="btn">Add to Wallet</button>
                    <div id="addMsg" style="margin-top: 10px; color: green; display: none;"></div>
                </form>

                <hr style="margin: 20px 0; border: 0; border-top: 1px solid #eee;">

                <h3 style="font-size: 1.1em; color: #555;">Or Add via Razorpay</h3>
                <form id="razorpayForm" onsubmit="event.preventDefault(); addFundsRazorpay();">
                    <div class="form-group">
                        <label for="rzpAmount">Amount ($)</label>
                        <input type="number" step="0.01" id="rzpAmount" required>
                    </div>
                    <button type="submit" class="btn" style="background-color: #3399cc;">Pay with Razorpay</button>
                    <div id="rzpMsg" style="margin-top: 10px; display: none;"></div>
                </form>
            </div>

            <!-- Withdraw Funds Form -->
            <div class="card" style="flex:1;">
                <h3>Withdraw Funds</h3>
                <form id="withdrawFundsForm" onsubmit="event.preventDefault(); withdrawFunds();">
                    <div class="form-group">
                        <label for="withdrawPaymentMethod">Payment Method (Withdraw to)</label>
                        <select id="withdrawPaymentMethod" required>
                            <option value="" disabled selected>Select a mapped card</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="withdrawAmount">Amount ($)</label>
                        <input type="number" step="0.01" id="withdrawAmount" required>
                    </div>
                    <div class="form-group">
                        <label for="withdrawPin">Transaction PIN</label>
                        <input type="password" id="withdrawPin" required>
                    </div>
                    <button type="submit" class="btn" style="background-color: #dc3545;">Withdraw</button>
                    <div id="withdrawMsg" style="margin-top: 10px; color: red; display: none;"></div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <div style="clear: both;"></div>
    <div th:replace="~{fragments/layout :: footerFragment}"></div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            if (!sessionStorage.getItem('jwtToken') || !sessionStorage.getItem('userId')) {
                window.location.href = "/login";
                return;
            }
            loadWalletBalance();
            loadPaymentMethods();
        });

        function loadWalletBalance() {
            const userId = sessionStorage.getItem('userId');
            fetchWithAuth(`/api/wallets/user/${userId}`)
                .then(res => res.json())
                .then(data => {
                    document.getElementById('walletBalance').innerText = '$' + data.balance.toFixed(2);
                });
        }

        function loadPaymentMethods() {
            const userId = sessionStorage.getItem('userId');
            fetchWithAuth(`/api/payment-methods/user/${userId}`)
                .then(res => res.json())
                .then(methods => {
                    const addSelect = document.getElementById('addPaymentMethod');
                    const withdrawSelect = document.getElementById('withdrawPaymentMethod');

                    methods.forEach(method => {
                        const maskedCard = `**** **** **** ${method.accountNumber.slice(-4)} (${method.type})`;
                        const option1 = new Option(maskedCard, method.id);
                        const option2 = new Option(maskedCard, method.id);
                        addSelect.add(option1);
                        withdrawSelect.add(option2);
                    });
                })
                .catch(err => console.error("Error loading payment methods", err));
        }

        function addFunds() {
            const amount = document.getElementById('addAmount').value;
            const paymentMethodId = document.getElementById('addPaymentMethod').value;
            const transactionPin = document.getElementById('addPin').value;
            const userId = sessionStorage.getItem('userId');

            fetchWithAuth(`/api/wallets/user/${userId}/add?amount=${amount}&paymentMethodId=${paymentMethodId}&transactionPin=${encodeURIComponent(transactionPin)}`, { method: 'POST' })
                .then(res => {
                    if (res.ok) {
                        document.getElementById('addMsg').innerText = "Funds added successfully!";
                        document.getElementById('addMsg').style.color = "green";
                        document.getElementById('addMsg').style.display = "block";
                        loadWalletBalance();
                        document.getElementById('addFundsForm').reset();
                    } else {
                        res.json().then(err => {
                            document.getElementById('addMsg').innerText = err.message || "Error adding funds";
                            document.getElementById('addMsg').style.color = "red";
                            document.getElementById('addMsg').style.display = "block";
                        });
                    }
                });
        }

        function withdrawFunds() {
            const amount = document.getElementById('withdrawAmount').value;
            const paymentMethodId = document.getElementById('withdrawPaymentMethod').value;
            const transactionPin = document.getElementById('withdrawPin').value;
            const userId = sessionStorage.getItem('userId');

            fetchWithAuth(`/api/wallets/user/${userId}/withdraw?amount=${amount}&paymentMethodId=${paymentMethodId}&transactionPin=${encodeURIComponent(transactionPin)}`, { method: 'POST' })
                .then(res => {
                    if (res.ok) {
                        document.getElementById('withdrawMsg').innerText = "Funds withdrawn successfully!";
                        document.getElementById('withdrawMsg').style.color = "green";
                        document.getElementById('withdrawMsg').style.display = "block";
                        loadWalletBalance();
                        document.getElementById('withdrawFundsForm').reset();
                    } else {
                        res.json().then(err => {
                            document.getElementById('withdrawMsg').innerText = err.message || "Error withdrawing funds";
                            document.getElementById('withdrawMsg').style.color = "red";
                            document.getElementById('withdrawMsg').style.display = "block";
                        });
                    }
                });
        }

        function addFundsRazorpay() {
            const amount = document.getElementById('rzpAmount').value;
            const userId = sessionStorage.getItem('userId');
            const rzpMsg = document.getElementById('rzpMsg');

            rzpMsg.style.display = 'none';

            // 1. Create order on the server
            fetchWithAuth(`/api/payment/create-order`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ amount: amount, currency: 'USD' })
            })
                .then(res => res.json())
                .then(orderData => {
                    if (!orderData || !orderData.orderId) {
                        throw new Error(orderData.message || "Failed to create order");
                    }

                    // 2. Initialize Razorpay Checkout
                    const options = {
                        "key": orderData.keyId,
                        "amount": orderData.amount,
                        "currency": orderData.currency,
                        "name": "RevPay Wallet",
                        "description": "Add Funds to Wallet",
                        "order_id": orderData.orderId,
                        "handler": function (response) {
                            // 3. Verify Payment
                            verifyRazorpayPayment(response, amount, userId);
                        },
                        "prefill": {
                            "name": "User",
                            "email": "user@example.com"
                        },
                        "theme": {
                            "color": "#3399cc"
                        }
                    };
                    const rzp = new Razorpay(options);
                    rzp.on('payment.failed', function (response) {
                        rzpMsg.innerText = "Payment failed: " + response.error.description;
                        rzpMsg.style.color = "red";
                        rzpMsg.style.display = "block";
                    });
                    rzp.open();
                })
                .catch(err => {
                    console.error(err);
                    rzpMsg.innerText = err.message || "Error creating Razorpay order";
                    rzpMsg.style.color = "red";
                    rzpMsg.style.display = "block";
                });
        }

        function verifyRazorpayPayment(paymentResponse, amount, userId) {
            const rzpMsg = document.getElementById('rzpMsg');

            fetchWithAuth(`/api/payment/verify`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    userId: userId,
                    amount: amount,
                    razorpayPaymentId: paymentResponse.razorpay_payment_id,
                    razorpayOrderId: paymentResponse.razorpay_order_id,
                    razorpaySignature: paymentResponse.razorpay_signature
                })
            })
                .then(res => {
                    if (res.ok) {
                        return res.json().then(data => {
                            rzpMsg.innerText = "Funds added successfully via Razorpay!";
                            rzpMsg.style.color = "green";
                            rzpMsg.style.display = "block";
                            loadWalletBalance();
                            document.getElementById('razorpayForm').reset();
                        });
                    } else {
                        return res.json().then(err => {
                            rzpMsg.innerText = err.error || "Payment verification failed";
                            rzpMsg.style.color = "red";
                            rzpMsg.style.display = "block";
                        });
                    }
                })
                .catch(err => {
                    rzpMsg.innerText = "Error verifying payment";
                    rzpMsg.style.color = "red";
                    rzpMsg.style.display = "block";
                });
        }
    </script>
</body>

</html>

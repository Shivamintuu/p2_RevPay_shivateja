<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <div th:replace="~{fragments/layout :: headFragment('My Wallet - RevPay')}"></div>
</head>

<body>
    <div th:replace="~{fragments/layout :: headerFragment}"></div>
    <div class="main-content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 style="font-size: 2rem; font-weight: 800; letter-spacing: -0.5px; margin: 0;">My Wallet</h1>
        </div>

        <div class="enterprise-balance-card mb-4">
            <h3 style="font-weight: 500; font-size:1.1rem; opacity:0.9; margin:0;">Current Balance</h3>
            <div class="balance-amount" id="walletBalance" style="color: white;" th:text="${'$' + #numbers.formatDecimal(walletBalance ?: 0, 1, 2)}">$0.00</div>
        </div>

        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 1.5rem;">
            <!-- Add Funds Form -->
            <div class="card" style="padding: 2rem;">
                <h3 style="font-size: 1.25rem; font-weight: 700; margin-bottom: 1.5rem; color: var(--text-main);">Add
                    Funds</h3>
                <form id="addFundsForm" onsubmit="event.preventDefault(); addFunds();">
                    <div class="form-group">
                        <label for="addPaymentMethod">Payment Method</label>
                        <select id="addPaymentMethod" required>
                            <option value="" disabled selected>Select a mapped card</option>
                            <option th:each="method : ${paymentMethods}" 
                                    th:value="${method.id}" 
                                    th:text="${'**** **** **** ' + method.accountNumberMasked.substring(method.accountNumberMasked.length() - 4) + ' (' + method.type + ')'}">
                            </option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="addAmount">Amount ($)</label>
                        <input type="number" step="0.01" id="addAmount" required placeholder="0.00">
                    </div>
                    <div class="form-group">
                        <label for="addPin">Transaction PIN</label>
                        <input type="password" id="addPin" required placeholder="••••">
                    </div>
                    <button type="submit" class="btn btn-primary"
                        style="width: 100%; margin-top: 0.5rem; padding: 0.8rem;">Add to Wallet</button>
                    <div id="addMsg" class="alert mt-2" style="display: none;"></div>
                </form>

                <div
                    style="margin: 2rem 0; display: flex; align-items: center; text-align: center; color: var(--text-muted);">
                    <hr style="flex: 1; border: 0; border-top: 1px solid var(--border);">
                    <span style="padding: 0 1rem; font-size: 0.9rem; font-weight: 500;">Or</span>
                    <hr style="flex: 1; border: 0; border-top: 1px solid var(--border);">
                </div>

                <h3 style="font-size: 1.1rem; font-weight: 600; margin-bottom: 1rem; color: var(--text-main);">Add via
                    Razorpay</h3>
                <form id="razorpayForm" onsubmit="event.preventDefault(); addFundsRazorpay();">
                    <div class="form-group mb-3">
                        <label for="rzpAmount">Amount ($) <span class="text-secondary"
                                style="font-size: 0.8rem; font-weight: normal;">(Max $1,000)</span></label>
                        <input type="number" step="0.01" min="1" max="1000" id="rzpAmount" required placeholder="0.00">
                    </div>
                    <button type="submit" class="btn"
                        style="background-color: #3399cc; color: white; width: 100%; padding: 0.8rem;">Pay with
                        Razorpay</button>
                    <div id="rzpMsg" class="alert mt-2" style="display: none;"></div>
                </form>
            </div>

            <!-- Withdraw Funds Form -->
            <div class="card" style="padding: 2rem;">
                <h3 style="font-size: 1.25rem; font-weight: 700; margin-bottom: 1.5rem; color: var(--text-main);">
                    Withdraw Funds</h3>
                <form id="withdrawFundsForm" onsubmit="event.preventDefault(); withdrawFunds();">
                    <div class="form-group">
                        <label for="withdrawPaymentMethod">Payment Method (Withdraw to)</label>
                        <select id="withdrawPaymentMethod" required>
                            <option value="" disabled selected>Select a mapped card</option>
                            <option th:each="method : ${paymentMethods}" 
                                    th:value="${method.id}" 
                                    th:text="${'**** **** **** ' + method.accountNumberMasked.substring(method.accountNumberMasked.length() - 4) + ' (' + method.type + ')'}">
                            </option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="withdrawAmount">Amount ($)</label>
                        <input type="number" step="0.01" id="withdrawAmount" required placeholder="0.00">
                    </div>
                    <div class="form-group mb-4">
                        <label for="withdrawPin">Transaction PIN</label>
                        <input type="password" id="withdrawPin" required placeholder="••••">
                    </div>
                    <button type="submit" class="btn"
                        style="background-color: var(--danger); color: white; width: 100%; padding: 0.8rem;">Withdraw
                        Funds</button>
                    <div id="withdrawMsg" class="alert mt-2" style="display: none;"></div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <div style="clear: both;"></div>
    <div th:replace="~{fragments/layout :: footerFragment}"></div>

    <script th:inline="javascript">
        const currentUserId = /*[[${session.user.id}]]*/ null;

        document.addEventListener("DOMContentLoaded", function () {
            // No initial fetch needed for balance/methods
        });

        function loadWalletBalance() {
            // Still useful for post-transaction updates
            fetchWithAuth(`/api/wallets/user/${currentUserId}`)
                .then(res => res.json())
                .then(data => {
                    document.getElementById('walletBalance').innerText = '$' + data.balance.toFixed(2);
                });
        }

        function loadPaymentMethods() {
             // Reload page to refresh server-rendered list if needed, or just keep as is
             window.location.reload();
        }

        function addFunds() {
            const amount = document.getElementById('addAmount').value;
            const paymentMethodId = document.getElementById('addPaymentMethod').value;
            const transactionPin = document.getElementById('addPin').value;

            fetchWithAuth(`/api/wallets/user/${currentUserId}/add?amount=${amount}&paymentMethodId=${paymentMethodId}&transactionPin=${encodeURIComponent(transactionPin)}`, { method: 'POST' })
                .then(res => {
                    if (res.ok) {
                        document.getElementById('addMsg').innerText = "Funds added successfully!";
                        document.getElementById('addMsg').style.color = "green";
                        document.getElementById('addMsg').style.display = "block";
                        loadWalletBalance();
                        document.getElementById('addFundsForm').reset();
                    } else {
                        res.json().then(err => {
                            document.getElementById('addMsg').innerText = err.message || "Error adding funds";
                            document.getElementById('addMsg').style.color = "red";
                            document.getElementById('addMsg').style.display = "block";
                        });
                    }
                });
        }

        function withdrawFunds() {
            const amount = document.getElementById('withdrawAmount').value;
            const paymentMethodId = document.getElementById('withdrawPaymentMethod').value;
            const transactionPin = document.getElementById('withdrawPin').value;

            fetchWithAuth(`/api/wallets/user/${currentUserId}/withdraw?amount=${amount}&paymentMethodId=${paymentMethodId}&transactionPin=${encodeURIComponent(transactionPin)}`, { method: 'POST' })
                .then(res => {
                    if (res.ok) {
                        document.getElementById('withdrawMsg').innerText = "Funds withdrawn successfully!";
                        document.getElementById('withdrawMsg').style.color = "green";
                        document.getElementById('withdrawMsg').style.display = "block";
                        loadWalletBalance();
                        document.getElementById('withdrawFundsForm').reset();
                    } else {
                        res.json().then(err => {
                            document.getElementById('withdrawMsg').innerText = err.message || "Error withdrawing funds";
                            document.getElementById('withdrawMsg').style.color = "red";
                            document.getElementById('withdrawMsg').style.display = "block";
                        });
                    }
                });
        }

        function addFundsRazorpay() {
            const amount = document.getElementById('rzpAmount').value;
            const rzpMsg = document.getElementById('rzpMsg');

            rzpMsg.style.display = 'none';

            // 1. Create order on the server
            fetchWithAuth(`/api/payment/create-order`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ amount: amount, currency: 'USD' })
            })
                .then(res => res.json())
                .then(orderData => {
                    if (!orderData || !orderData.orderId) {
                        throw new Error(orderData.message || "Failed to create order");
                    }

                    // 2. Initialize Razorpay Checkout
                    const options = {
                        "key": orderData.keyId,
                        "amount": orderData.amount,
                        "currency": orderData.currency,
                        "name": "RevPay Wallet",
                        "description": "Add Funds to Wallet",
                        "order_id": orderData.orderId,
                        "handler": function (response) {
                            // 3. Verify Payment
                            verifyRazorpayPayment(response, amount, currentUserId);
                        },
                        "prefill": {
                            "name": "User",
                            "email": "user@example.com"
                        },
                        "theme": {
                            "color": "#3399cc"
                        }
                    };
                    const rzp = new Razorpay(options);
                    rzp.on('payment.failed', function (response) {
                        rzpMsg.innerText = "Payment failed: " + response.error.description;
                        rzpMsg.style.color = "red";
                        rzpMsg.style.display = "block";
                    });
                    rzp.open();
                })
                .catch(err => {
                    console.error(err);
                    rzpMsg.innerText = err.message || "Error creating Razorpay order";
                    rzpMsg.style.color = "red";
                    rzpMsg.style.display = "block";
                });
        }

        function verifyRazorpayPayment(paymentResponse, amount, userId) {
            const rzpMsg = document.getElementById('rzpMsg');

            fetchWithAuth(`/api/payment/verify`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    userId: userId,
                    amount: amount,
                    razorpayPaymentId: paymentResponse.razorpay_payment_id,
                    razorpayOrderId: paymentResponse.razorpay_order_id,
                    razorpaySignature: paymentResponse.razorpay_signature
                })
            })
                .then(res => {
                    if (res.ok) {
                        return res.json().then(data => {
                            rzpMsg.innerText = "Funds added successfully via Razorpay!";
                            rzpMsg.style.color = "green";
                            rzpMsg.style.display = "block";
                            loadWalletBalance();
                            document.getElementById('razorpayForm').reset();
                        });
                    } else {
                        return res.json().then(err => {
                            rzpMsg.innerText = err.error || "Payment verification failed";
                            rzpMsg.style.color = "red";
                            rzpMsg.style.display = "block";
                        });
                    }
                })
                .catch(err => {
                    rzpMsg.innerText = "Error verifying payment";
                    rzpMsg.style.color = "red";
                    rzpMsg.style.display = "block";
                });
        }
    </script>
</body>

</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <div th:replace="~{fragments/layout :: headFragment('My Wallet - RevPay')}"></div>
</head>

<body>
    <div th:replace="~{fragments/layout :: headerFragment}"></div>
    <div class="main-content">
        <h2>My Wallet</h2>

        <div class="card" style="margin-bottom: 20px;">
            <h3>Current Balance: <span id="walletBalance" style="color: #28a745;">$0.00</span></h3>
        </div>

        <div style="display: flex; gap: 20px;">
            <!-- Add Funds Form -->
            <div class="card" style="flex:1;">
                <h3>Add Funds</h3>
                <form id="addFundsForm" onsubmit="event.preventDefault(); addFunds();">
                    <div class="form-group">
                        <label for="addAmount">Amount ($)</label>
                        <input type="number" step="0.01" id="addAmount" required>
                    </div>
                    <button type="submit" class="btn">Add to Wallet</button>
                    <div id="addMsg" style="margin-top: 10px; color: green; display: none;"></div>
                </form>
            </div>

            <!-- Withdraw Funds Form -->
            <div class="card" style="flex:1;">
                <h3>Withdraw Funds</h3>
                <form id="withdrawFundsForm" onsubmit="event.preventDefault(); withdrawFunds();">
                    <div class="form-group">
                        <label for="withdrawAmount">Amount ($)</label>
                        <input type="number" step="0.01" id="withdrawAmount" required>
                    </div>
                    <button type="submit" class="btn" style="background-color: #dc3545;">Withdraw</button>
                    <div id="withdrawMsg" style="margin-top: 10px; color: red; display: none;"></div>
                </form>
            </div>
        </div>
    </div>

    <div style="clear: both;"></div>
    <div th:replace="~{fragments/layout :: footerFragment}"></div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            if (!sessionStorage.getItem('jwtToken') || !sessionStorage.getItem('userId')) {
                window.location.href = "/login";
                return;
            }
            loadWalletBalance();
        });

        function loadWalletBalance() {
            const userId = sessionStorage.getItem('userId');
            fetchWithAuth(`/api/wallets/user/${userId}`)
                .then(res => res.json())
                .then(data => {
                    document.getElementById('walletBalance').innerText = '$' + data.balance.toFixed(2);
                });
        }

        function addFunds() {
            const amount = document.getElementById('addAmount').value;
            const userId = sessionStorage.getItem('userId');

            fetchWithAuth(`/api/wallets/user/${userId}/add?amount=${amount}`, { method: 'POST' })
                .then(res => {
                    if (res.ok) {
                        document.getElementById('addMsg').innerText = "Funds added successfully!";
                        document.getElementById('addMsg').style.display = "block";
                        loadWalletBalance();
                        document.getElementById('addFundsForm').reset();
                    } else {
                        alert("Error adding funds");
                    }
                });
        }

        function withdrawFunds() {
            const amount = document.getElementById('withdrawAmount').value;
            const userId = sessionStorage.getItem('userId');

            fetchWithAuth(`/api/wallets/user/${userId}/withdraw?amount=${amount}`, { method: 'POST' })
                .then(res => {
                    if (res.ok) {
                        document.getElementById('withdrawMsg').innerText = "Funds withdrawn successfully!";
                        document.getElementById('withdrawMsg').style.display = "block";
                        document.getElementById('withdrawMsg').style.color = "green";
                        loadWalletBalance();
                        document.getElementById('withdrawFundsForm').reset();
                    } else {
                        res.json().then(err => {
                            document.getElementById('withdrawMsg').innerText = err.message || "Error withdrawing funds";
                            document.getElementById('withdrawMsg').style.display = "block";
                        });
                    }
                });
        }
    </script>
</body>

</html>

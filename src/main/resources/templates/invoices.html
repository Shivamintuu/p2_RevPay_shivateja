<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <div th:replace="~{fragments/layout :: headFragment('Manage Invoices - RevPay')}"></div>
    <style>
        .status-draft {
            background: #e2e8f0;
            color: #475569;
        }

        .status-sent {
            background: #dcfce7;
            color: #166534;
        }

        .status-paid {
            background: #dbeafe;
            color: #1e40af;
        }

        .status-overdue {
            background: #fee2e2;
            color: #991b1b;
        }

        .status-cancelled {
            background: #f1f5f9;
            color: #94a3b8;
            text-decoration: line-through;
        }
    </style>
</head>

<body>
    <div th:replace="~{fragments/layout :: headerFragment}"></div>

    <div class="main-content">
        <h2 style="display: flex; justify-content: space-between; align-items: center;">
            Manage Invoices
            <a href="/invoice/create" class="btn">+ Create Invoice</a>
        </h2>

        <div class="card" style="padding: 20px;">
            <div th:if="${#lists.isEmpty(invoices)}" style="text-align:center; padding: 20px;">
                No invoices found.
            </div>

            <div th:if="${!#lists.isEmpty(invoices)}" id="invoiceContainer" style="overflow-x: auto;">
                <table style="width: 100%; border-collapse: collapse; text-align: left;">
                    <thead>
                        <tr style="border-bottom: 2px solid #e2e8f0; color: #64748b; font-size: 0.85rem; text-transform: uppercase;">
                            <th style="padding: 15px 10px;">ID</th>
                            <th style="padding: 15px 10px;">Customer</th>
                            <th style="padding: 15px 10px;">Due Date</th>
                            <th style="padding: 15px 10px;">Amount</th>
                            <th style="padding: 15px 10px;">Status</th>
                            <th style="padding: 15px 10px; text-align: right;">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="invoiceBody">
                        <tr th:each="inv : ${invoices}" style="border-bottom: 1px solid #f1f5f9;">
                            <td style="padding: 15px 10px; font-weight: bold; color: #64748b;" th:text="${'#INV-' + inv.id}"></td>
                            <td style="padding: 15px 10px;">
                                <div style="font-weight: 500;" th:text="${inv.customerName}"></div>
                                <div style="font-size: 0.8rem; color: #94a3b8;" th:text="${inv.customerEmail}"></div>
                            </td>
                            <td style="padding: 15px 10px; color: #475569;" th:text="${inv.dueDate}"></td>
                            <td style="padding: 15px 10px; font-weight: bold;" th:text="${'$' + #numbers.formatDecimal(inv.totalAmount, 1, 2)}"></td>
                            <td style="padding: 15px 10px;">
                                <span th:class="'status-' + ${inv.status.name().toLowerCase()}" 
                                      style="padding: 4px 10px; border-radius: 12px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase;"
                                      th:text="${inv.status}">
                                </span>
                            </td>
                            <td style="padding: 15px 10px; text-align: right;">
                                <div th:if="${inv.status.name() == 'DRAFT'}">
                                    <button th:onclick="'sendInvoice(' + ${inv.id} + ')'" class="btn" style="padding: 6px 12px; font-size: 0.8rem; background: #8b5cf6;">Send</button>
                                </div>
                                <div th:if="${inv.status.name() == 'SENT' || inv.status.name() == 'OVERDUE'}">
                                    <button th:onclick="'markAsPaid(' + ${inv.id} + ')'" class="btn" style="padding: 6px 12px; font-size: 0.8rem; background: #10b981;">Mark Paid</button>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div id="errorMsg" class="error" style="display:none; margin-top: 15px;"></div>
        </div>
    </div>

    <div th:replace="~{fragments/layout :: footerFragment}"></div>

    <script th:inline="javascript">
        document.addEventListener('DOMContentLoaded', () => {
             // Initial render handled by Thymeleaf
        });

        async function sendInvoice(id) {
             if (!confirm("Are you sure you want to send this invoice to the customer?")) return;
             try {
                 const res = await fetch(`/api/invoices/${id}/send-notification`, { 
                     method: 'POST',
                     headers: { 'Authorization': 'Bearer ' + sessionStorage.getItem('token') }
                 });
                 if (res.ok) {
                     alert('Invoice notification sent!');
                     window.location.reload();
                 } else {
                     alert('Failed to send invoice.');
                 }
             } catch (e) { console.error(e); }
        }

        async function markAsPaid(id) {
             if (!confirm("Mark this invoice as Paid?")) return;
             try {
                 const res = await fetch(`/api/invoices/${id}/pay`, { 
                     method: 'PUT',
                     headers: { 'Authorization': 'Bearer ' + sessionStorage.getItem('token') }
                 });
                 if (res.ok) {
                     alert('Invoice marked as paid!');
                     window.location.reload();
                 } else {
                     alert('Failed to update invoice.');
                 }
             } catch (e) { console.error(e); }
        }
    </script>
</body>

</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <div th:replace="~{fragments/layout :: headFragment('Profile - RevPay')}"></div>
</head>

<body>
    <div th:replace="~{fragments/layout :: headerFragment}"></div>

    <div class="main-content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 style="font-size: 2rem; font-weight: 800; letter-spacing: -0.5px; margin: 0;">User Profile</h1>
        </div>

        <div class="card" id="profileCard" style="max-width: 600px; padding: 2rem;">
            <div id="profileDetails">
                <div style="display: grid; gap: 1rem;">
                    <div><strong class="text-secondary" style="font-size: 0.85rem; text-transform: uppercase;">Full
                            Name</strong>
                        <div id="profName" style="font-size: 1.1rem; font-weight: 600; color: var(--text-main);" th:text="${session.user.fullName}"></div>
                    </div>
                    <div><strong class="text-secondary"
                            style="font-size: 0.85rem; text-transform: uppercase;">Email</strong>
                        <div id="profEmail" style="color: var(--text-main);" th:text="${session.user.email}"></div>
                    </div>
                    <div><strong class="text-secondary" style="font-size: 0.85rem; text-transform: uppercase;">Phone
                            Number</strong>
                        <div id="profPhone" style="color: var(--text-main);" th:text="${session.user.phoneNumber ?: 'N/A'}"></div>
                    </div>
                    <div><strong class="text-secondary" style="font-size: 0.85rem; text-transform: uppercase;">Account
                            Type</strong>
                        <div id="profRole" style="color: var(--text-main);" th:text="${session.user.role}"></div>
                    </div>
                </div>

                <div th:if="${session.user.role.name() == 'BUSINESS'}" id="businessInfo"
                    style="margin-top: 2rem; border-top: 1px solid var(--border); padding-top: 1.5rem;">
                    <h3 style="font-size: 1.1rem; font-weight: 700; margin-bottom: 1rem; color: var(--text-main);">
                        Business Information</h3>
                    <div style="display: grid; gap: 1rem;">
                        <div><strong class="text-secondary"
                                style="font-size: 0.85rem; text-transform: uppercase;">Business Name</strong>
                            <div id="profBusName" style="font-size: 1.1rem; font-weight: 600; color: var(--text-main);" th:text="${session.user.businessName ?: 'N/A'}">
                            </div>
                        </div>
                        <div><strong class="text-secondary"
                                style="font-size: 0.85rem; text-transform: uppercase;">Business Type</strong>
                            <div id="profBusType" style="color: var(--text-main);" th:text="${session.user.businessType ?: 'N/A'}"></div>
                        </div>
                    </div>
                </div>

                <div style="margin-top: 2rem;">
                    <a th:href="@{/user/settings}" class="btn btn-primary w-100"
                        style="text-align: center; text-decoration: none;">Account Settings</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Profile is now server-rendered. No initial fetch needed.
    </script>
</body>

</html>

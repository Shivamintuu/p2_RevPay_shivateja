<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:fragment="headFragment (title)">
    <meta charset="UTF-8">
    <title th:text="${title}">RevPay Application</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script th:src="@{/js/app.js}"></script>
</head>

<body>
    <!-- Global Loading Overlay -->
    <div id="globalLoader" class="loader-overlay" style="display: none;">
        <div class="spinner"></div>
    </div>

    <!-- Top Header -->
    <header th:fragment="headerFragment">
        <div class="logo">
            <h2 style="margin:0;">
                <a th:href="@{/}">RevPay</a>
            </h2>
        </div>
        <div class="nav-links">
            <span th:if="${session.user != null}" id="authenticatedLinks" style="display:flex; gap:1.5rem; align-items:center;">
                <a th:href="@{/dashboard}" id="navDashboard">Dashboard</a>
                <a th:href="@{/history}" id="navTransactions">Transactions</a>
                <a th:href="@{/money-request/manage}" id="navRequests">Requests</a>
                <a th:href="@{/payment-method/manage}" id="navCards">Cards</a>
                <a th:href="@{/notifications}" id="navNotifications">Notifications</a>
                <a th:if="${session.user.role.name() == 'ADMIN'}" th:href="@{/admin}" id="navAdmin">Admin</a>
                <a th:if="${session.user.role.name() == 'BUSINESS'}" th:href="@{/invoice/manage}" id="navInvoices">Invoices</a>
                <a th:if="${session.user.role.name() == 'BUSINESS'}" th:href="@{/loan/status}" id="navLoans">Loans</a>
                <a th:if="${session.user.role.name() == 'BUSINESS'}" th:href="@{/business/analytics}" id="navAnalytics">Analytics</a>
            </span>
            <span class="auth-nav" th:if="${session.user != null}">
                <a th:href="@{/user/profile}" id="navProfile">Profile</a>
                <button onclick="handleLogout()" id="logoutLink" class="btn btn-outline" style="padding:0.4rem 1rem;">Logout</button>
            </span>
            <span class="auth-nav guest-only" th:if="${session.user == null}">
                <a th:href="@{/login}" id="loginLink" style="font-weight:600;">Login</a>
                <a th:href="@{/register}" id="registerLink" class="btn btn-primary" style="padding:0.4rem 1.25rem;">Sign Up</a>
            </span>
        </div>
    </header>

    <!-- Sidebar removed, links moved to navbar -->
    <div th:fragment="sidebarFragment" style="display:none;"></div>

    <!-- Footer -->
    <footer th:fragment="footerFragment">
        <p>&copy; 2026 RevPay Financial Services</p>
    </footer>
</body>

</html>

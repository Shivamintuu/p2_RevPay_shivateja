<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <div th:replace="~{fragments/layout :: headFragment('Payment Methods - RevPay')}"></div>
</head>

<body>
    <div th:replace="~{fragments/layout :: headerFragment}"></div>

    <div class="main-content">
        <h2>Payment Methods</h2>

        <div style="display: flex; gap: 30px; flex-wrap: wrap; align-items: flex-start;">
            <!-- Left Column: Saved Methods -->
            <div class="card" style="flex: 1; min-width: 300px;">
                <h3>Saved Methods</h3>
                <div id="pmLoader">Loading payment methods...</div>
                <div id="pmList" style="display:none;"></div>
                <p id="noPm" style="display:none;">No payment methods saved yet.</p>
            </div>

            <!-- Right Column: Add Payment Method -->
            <div class="card" style="flex: 1; min-width: 300px; max-width: 500px;">
                <h3>Add Payment Method</h3>
                <form id="addPaymentForm" onsubmit="event.preventDefault(); handleAddPayment();">
                    <div class="form-group">
                        <label for="methodType">Type</label>
                        <select id="methodType" required>
                            <option value="CREDIT_CARD">Credit Card</option>
                            <option value="DEBIT_CARD">Debit Card</option>
                            <option value="BANK_ACCOUNT">Bank Account</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="cardNumber">Card / Account Number</label>
                        <input type="text" id="cardNumber" required maxlength="16" placeholder="Last 4 digits shown">
                    </div>
                    <div class="form-group">
                        <label for="cardHolder">Card Holder Name</label>
                        <input type="text" id="cardHolder" required placeholder="Name on card">
                    </div>
                    <div class="form-group">
                        <label for="expiryDate">Expiry Date (MM/YY)</label>
                        <input type="text" id="expiryDate" required placeholder="01/25"
                            pattern="^(0[1-9]|1[0-2])/?([0-9]{2})$">
                    </div>
                    <div class="form-group">
                        <label for="billingAddress">Billing Address</label>
                        <input type="text" id="billingAddress" required placeholder="123 Main St">
                    </div>
                    <div class="form-group" style="display: flex; align-items: center; gap: 10px;">
                        <input type="checkbox" id="isDefault" style="width: auto;">
                        <label for="isDefault" style="margin: 0;">Set as default method</label>
                    </div>
                    <div id="addMsg" style="margin-bottom: 10px;"></div>
                    <button type="submit" class="btn">Add Method</button>
                </form>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/layout :: footerFragment}"></div>

    <script>
        document.addEventListener('DOMContentLoaded', loadPaymentMethods);

        async function loadPaymentMethods() {
            const user = JSON.parse(sessionStorage.getItem('user'));
            try {
                const response = await fetch(`/api/payment-methods/user/${user.id}`, {
                    headers: { 'Authorization': 'Bearer ' + sessionStorage.getItem('token') }
                });

                document.getElementById('pmLoader').style.display = 'none';

                if (response.ok) {
                    const methods = await response.json();
                    if (methods.length > 0) {
                        const listDiv = document.getElementById('pmList');
                        methods.forEach(pm => {
                            listDiv.innerHTML += `
                                <div style="padding: 15px; border: 1px solid var(--border-color); border-radius: 8px; margin-bottom: 15px; display:flex; justify-content:space-between; align-items:center; background:#f8fafc;">
                                    <div>
                                        <div style="font-weight: 600; color: var(--text-main); font-size: 1.1rem; letter-spacing: 1px;">
                                            **** **** **** ${pm.accountNumberMasked.slice(-4)}
                                        </div>
                                        <div style="font-size: 0.85rem; color: var(--text-secondary); margin-top: 4px;">
                                            ${pm.type.replace('_', ' ')}
                                        </div>
                                    </div>
                                    <button onclick="deleteMethod(${pm.id})" class="btn-sm" style="background:var(--danger); border:none; color:white; padding:6px 12px; border-radius:4px; font-weight:500;">Remove</button>
                                </div>`;
                        });
                        listDiv.style.display = 'block';
                    } else {
                        document.getElementById('noPm').style.display = 'block';
                    }
                }
            } catch (err) {
                document.getElementById('pmLoader').innerText = "Could not load payment methods.";
            }
        }

        async function handleAddPayment() {
            const user = JSON.parse(sessionStorage.getItem('user'));
            const cardNum = document.getElementById('cardNumber').value;
            const msg = document.getElementById('addMsg');
            const submitBtn = document.querySelector('#addPaymentForm button[type="submit"]');

            const payload = {
                userId: user.id,
                type: document.getElementById('methodType').value,
                accountNumberMasked: cardNum,
                expiryDate: document.getElementById('expiryDate').value,
                billingAddress: document.getElementById('billingAddress').value,
                isDefault: document.getElementById('isDefault').checked
            };

            const originalBtnText = submitBtn.innerHTML;
            submitBtn.innerHTML = '<span class="spinner"></span>Processing...';
            submitBtn.disabled = true;

            try {
                const response = await fetch(`/api/payment-methods/user/${user.id}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + sessionStorage.getItem('token')
                    },
                    body: JSON.stringify(payload)
                });
                if (response.ok) {
                    msg.innerText = "Payment method added!";
                    msg.style.color = "green";
                    document.getElementById('addPaymentForm').reset();
                    document.getElementById('pmList').innerHTML = '';
                    document.getElementById('pmList').style.display = 'none';
                    document.getElementById('pmLoader').style.display = 'block';
                    document.getElementById('pmLoader').innerText = 'Loading payment methods...';
                    await new Promise(r => setTimeout(r, 600)); // Artificial delay for smoothness
                    loadPaymentMethods();
                } else {
                    const data = await response.json();
                    throw new Error(data.message || "Failed to add payment method");
                }
            } catch (err) {
                msg.innerText = err.message;
                msg.style.color = "red";
            } finally {
                submitBtn.innerHTML = originalBtnText;
                submitBtn.disabled = false;
            }
        }

        async function deleteMethod(id) {
            if (!confirm("Remove this payment method?")) return;
            const user = JSON.parse(sessionStorage.getItem('user'));
            try {
                const response = await fetch(`/api/payment-methods/${id}/user/${user.id}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': 'Bearer ' + sessionStorage.getItem('token') }
                });
                if (response.ok) {
                    document.getElementById('pmList').innerHTML = '';
                    document.getElementById('pmLoader').style.display = 'block';
                    document.getElementById('pmLoader').innerText = 'Loading payment methods...';
                    loadPaymentMethods();
                }
            } catch (err) { }
        }
    </script>
</body>

</html>

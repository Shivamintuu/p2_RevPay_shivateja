<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>RevPay - Notifications</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script th:src="@{/js/app.js}"></script>
</head>

<body>
    <div th:replace="~{fragments/layout :: headerFragment}"></div>

    <div class="main-content">
        <h1>Notifications</h1>

        <div class="card" style="margin-bottom: 20px;">
            <h3>Notification Preferences</h3>
            <div style="display: flex; gap: 20px; align-items: center; margin-top: 10px;">
                <label>
                    <input type="checkbox" id="prefTransaction" th:checked="${session.user.transactionAlerts != false}"> Transaction Alerts
                </label>
                <label>
                    <input type="checkbox" id="prefSecurity" th:checked="${session.user.securityAlerts != false}"> Security Alerts
                </label>
                <button class="btn btn-sm" onclick="savePreferences()">Save Preferences</button>
            </div>
            <div id="prefMsg" style="margin-top: 10px; display: none;"></div>
        </div>

        <div id="notificationsList" class="notification-container">
            <div th:if="${#lists.isEmpty(notifications)}">
                <p>No new notifications.</p>
            </div>
            <div th:each="n : ${notifications}" th:class="'card ' + (${n.read} ? 'read' : 'unread')" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; padding: 15px;">
                <div>
                    <p th:style="${n.read} ? 'font-weight: normal;' : 'font-weight: 600;'" th:text="${n.message}"></p>
                    <small th:text="${#temporals.format(n.createdAt, 'MMM dd, yyyy HH:mm')}"></small>
                </div>
                <div th:if="${!n.read}">
                    <button class="btn btn-sm" th:onclick="'markAsRead(' + ${n.id} + ')'">Mark as Read</button>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/layout :: footerFragment}"></div>

    <script th:inline="javascript">
        document.addEventListener('DOMContentLoaded', function () {
            // Initial render handled by Thymeleaf
        });

        async function savePreferences() {
            const userId = /*[[${session.user.id}]]*/ null;
            const msg = document.getElementById('prefMsg');

            const payload = {
                transactionAlerts: document.getElementById('prefTransaction').checked,
                securityAlerts: document.getElementById('prefSecurity').checked
            };

            try {
                const response = await fetch(`/api/users/${userId}/preferences`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + sessionStorage.getItem('token')
                    },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    msg.innerText = "Preferences updated!";
                    msg.style.color = "green";
                    msg.style.display = "block";
                    setTimeout(() => msg.style.display = 'none', 3000);
                } else {
                    throw new Error("Failed to save");
                }
            } catch (err) {
                msg.innerText = "Error saving preferences";
                msg.style.color = "red";
                msg.style.display = "block";
            }
        }

        async function markAsRead(id) {
            try {
                const response = await fetch(`/api/notifications/${id}/read`, { 
                    method: 'PUT',
                    headers: { 'Authorization': 'Bearer ' + sessionStorage.getItem('token') }
                });
                if (response.ok) {
                    window.location.reload();
                }
            } catch (error) {
                console.error('Error marking as read', error);
            }
        }
    </script>
</body>

</html>

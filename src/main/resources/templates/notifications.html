<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>RevPay - Notifications</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script th:src="@{/js/app.js}"></script>
</head>

<body>
    <div th:replace="~{fragments/layout :: headerFragment}"></div>

    <div class="main-content">
        <h1>Notifications</h1>

        <div class="card" style="margin-bottom: 20px;">
            <h3>Notification Preferences</h3>
            <div style="display: flex; gap: 20px; align-items: center; margin-top: 10px;">
                <label>
                    <input type="checkbox" id="prefTransaction"> Transaction Alerts
                </label>
                <label>
                    <input type="checkbox" id="prefSecurity"> Security Alerts
                </label>
                <button class="btn btn-sm" onclick="savePreferences()">Save Preferences</button>
            </div>
            <div id="prefMsg" style="margin-top: 10px; display: none;"></div>
        </div>

        <div id="notificationsList" class="notification-container">
            <p>Loading notifications...</p>
        </div>
    </div>

    <div th:replace="~{fragments/layout :: footerFragment}"></div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            loadPreferences();
            fetchNotifications();
        });

        async function loadPreferences() {
            const userId = sessionStorage.getItem('userId');
            if (!userId) return;

            try {
                const response = await fetchWithAuth(`/api/users/${userId}`);
                if (response.ok) {
                    const data = await response.json();
                    document.getElementById('prefTransaction').checked = data.transactionAlerts !== false; // default true
                    document.getElementById('prefSecurity').checked = data.securityAlerts !== false; // default true
                }
            } catch (err) {
                console.error("Error loading preferences", err);
            }
        }

        async function savePreferences() {
            const userId = sessionStorage.getItem('userId');
            const msg = document.getElementById('prefMsg');

            const payload = {
                transactionAlerts: document.getElementById('prefTransaction').checked,
                securityAlerts: document.getElementById('prefSecurity').checked
            };

            try {
                const response = await fetch(`/api/users/${userId}/preferences`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + sessionStorage.getItem('token')
                    },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    msg.innerText = "Preferences updated!";
                    msg.style.color = "green";
                    msg.style.display = "block";
                    setTimeout(() => msg.style.display = 'none', 3000);
                } else {
                    throw new Error("Failed to save");
                }
            } catch (err) {
                msg.innerText = "Error saving preferences";
                msg.style.color = "red";
                msg.style.display = "block";
            }
        }

        async function fetchNotifications() {
            const userId = sessionStorage.getItem('userId');
            if (!userId) return;

            try {
                const response = await fetchWithAuth(`/api/notifications/user/${userId}`);
                if (response.ok) {
                    const data = await response.json();
                    const list = document.getElementById('notificationsList');
                    list.innerHTML = '';
                    if (data.length === 0) {
                        list.innerHTML = '<p>No new notifications.</p>';
                        return;
                    }

                    // Sort so unread are at the top, and latest first
                    data.sort((a, b) => {
                        if (a.read === b.read) {
                            return new Date(b.createdAt) - new Date(a.createdAt);
                        }
                        return a.read ? 1 : -1;
                    });

                    data.forEach(n => {
                        const d = document.createElement('div');
                        d.className = 'card ' + (n.read ? 'read' : 'unread');

                        const dateObj = Array.isArray(n.createdAt)
                            ? new Date(n.createdAt[0], n.createdAt[1] - 1, n.createdAt[2], n.createdAt[3], n.createdAt[4])
                            : new Date(n.createdAt);

                        const dateStr = dateObj.toLocaleString();

                        let actionBtn = '';
                        if (!n.read) {
                            actionBtn = `<button class="btn btn-sm" onclick="markAsRead(${n.id})">Mark as Read</button>`;
                        }

                        d.innerHTML = `
                            <div>
                                <p style="font-weight: ${n.read ? 'normal' : '600'};">${n.message}</p>
                                <small>${dateStr}</small>
                            </div>
                            <div>${actionBtn}</div>
                        `;
                        list.appendChild(d);
                    });
                }
            } catch (error) {
                console.error(error);
                document.getElementById('notificationsList').innerHTML = '<p class="error">Failed to load notifications.</p>';
            }
        }

        async function markAsRead(id) {
            try {
                const response = await fetchWithAuth(`/api/notifications/${id}/read`, { method: 'PUT' });
                if (response.ok) {
                    fetchNotifications();
                }
            } catch (error) {
                console.error('Error marking as read', error);
            }
        }
    </script>
</body>

</html>

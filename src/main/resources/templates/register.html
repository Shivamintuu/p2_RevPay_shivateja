<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <div th:replace="~{fragments/layout :: headFragment('Register - RevPay')}"></div>
</head>

<body>
    <div th:replace="~{fragments/layout :: headerFragment}"></div>

    <div class="container" style="max-width: 500px; margin: 50px auto;">
        <h2>Create an Account</h2>

        <form id="registerForm" onsubmit="event.preventDefault(); submitRegister();">
            <div class="form-group">
                <label for="accountType">Account Type</label>
                <select id="accountType" onchange="toggleBusinessFields()">
                    <option value="PERSONAL">Personal</option>
                    <option value="BUSINESS">Business</option>
                </select>
            </div>

            <div class="form-group">
                <label for="fullName">Full Name</label>
                <input type="text" id="fullName" name="fullName" required>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="text" id="phone" name="phone" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>

            <div class="form-group">
                <label for="transactionPin">Transaction PIN (4-6 digits)</label>
                <input type="password" id="transactionPin" name="transactionPin" pattern="\d{4,6}" title="4 to 6 digits" required>
            </div>

            <div class="form-group">
                <label for="securityQuestion">Security Question</label>
                <select id="securityQuestion" name="securityQuestion" required>
                    <option value="" disabled selected>Select a question</option>
                    <option value="What is your mother's maiden name?">What is your mother's maiden name?</option>
                    <option value="What was the name of your first pet?">What was the name of your first pet?</option>
                    <option value="What was the name of your first school?">What was the name of your first school?
                    </option>
                    <option value="In what city were you born?">In what city were you born?</option>
                </select>
            </div>

            <div class="form-group">
                <label for="securityAnswer">Security Answer</label>
                <input type="text" id="securityAnswer" name="securityAnswer" required>
            </div>

            <!-- Business Fields (Hidden by default) -->
            <div id="businessFields"
                style="display:none; padding: 10px; background: #f9f9f9; border-radius: 4px; margin-bottom: 15px;">
                <div class="form-group">
                    <label for="businessName">Business Name</label>
                    <input type="text" id="businessName" name="businessName">
                </div>
                <div class="form-group">
                    <label for="businessType">Business Type (Industry)</label>
                    <input type="text" id="businessType" name="businessType">
                </div>
            </div>

            <div id="errorMessage" class="error" style="display:none; margin-bottom: 10px;"></div>
            <div id="successMessage" style="color: green; display:none; margin-bottom: 10px;"></div>

            <button type="submit" class="btn" style="width: 100%;">Register</button>
        </form>
    </div>

    <div th:replace="~{fragments/layout :: footerFragment}"></div>

    <script>
        function toggleBusinessFields() {
            const type = document.getElementById("accountType").value;
            const bFields = document.getElementById("businessFields");
            if (type === "BUSINESS") {
                bFields.style.display = "block";
                document.getElementById("businessName").required = true;
            } else {
                bFields.style.display = "none";
                document.getElementById("businessName").required = false;
            }
        }

        function submitRegister() {
            const type = document.getElementById("accountType").value;
            const endpoint = type === "BUSINESS" ? '/api/auth/register/business' : '/api/auth/register/personal';

            const payload = {
                user: {
                    fullName: document.getElementById("fullName").value,
                    email: document.getElementById("email").value,
                    phoneNumber: document.getElementById("phone").value,
                    securityQuestion: document.getElementById("securityQuestion").value,
                    securityAnswer: document.getElementById("securityAnswer").value,
                    transactionPin: document.getElementById("transactionPin").value,
                    businessName: document.getElementById("businessName").value,
                    businessType: document.getElementById("businessType").value
                },
                password: document.getElementById("password").value
            };

            fetch(endpoint, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
                .then(response => {
                    if (response.ok) {
                        document.getElementById("successMessage").innerText = "Registration successful! You may now login.";
                        document.getElementById("successMessage").style.display = "block";
                        document.getElementById("errorMessage").style.display = "none";
                        document.getElementById("registerForm").reset();
                    } else {
                        return response.json().then(err => { throw new Error(err.message || "Registration failed"); });
                    }
                })
                .catch(error => {
                    document.getElementById("errorMessage").innerText = error.message;
                    document.getElementById("errorMessage").style.display = "block";
                    document.getElementById("successMessage").style.display = "none";
                });
        }
    </script>
</body>

</html>

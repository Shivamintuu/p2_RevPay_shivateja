<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <div th:replace="~{fragments/layout :: headFragment('Register - RevPay')}"></div>
</head>

<body>
    <div th:replace="~{fragments/layout :: headerFragment}"></div>

    <div
        style="min-height: calc(100vh - 80px); display: flex; align-items: center; justify-content: center; padding: 2rem; background: linear-gradient(135deg, var(--bg-color) 0%, var(--primary-light) 100%);">
        <div class="card" style="width: 100%; max-width: 500px; padding: 2.5rem 2rem;">
            <div class="text-center mb-4">
                <h2 style="font-weight: 800; color: var(--text-main); margin-bottom: 0.5rem; font-size: 1.75rem;">Create
                    Account</h2>
                <p class="text-secondary" style="font-size: 0.95rem;">Join RevPay and manage your finances effortlessly.
                </p>
            </div>

            <form id="registerForm" onsubmit="event.preventDefault(); submitRegister();">
                <div class="form-group">
                    <label for="accountType">Account Type</label>
                    <select id="accountType" onchange="toggleBusinessFields()">
                        <option value="PERSONAL">Personal</option>
                        <option value="BUSINESS">Business</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="fullName">Full Name</label>
                    <input type="text" id="fullName" name="fullName" required placeholder="John Doe">
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required placeholder="name@example.com">
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" name="phone" required placeholder="+1 (555) 000-0000">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required placeholder="••••••••">
                </div>

                <div class="form-group">
                    <label for="transactionPin">Transaction PIN (4-6 digits)</label>
                    <input type="password" id="transactionPin" name="transactionPin" pattern="\d{4,6}"
                        title="4 to 6 digits" required placeholder="••••">
                </div>

                <div class="form-group">
                    <label for="securityQuestion">Security Question</label>
                    <select id="securityQuestion" name="securityQuestion" required>
                        <option value="" disabled selected>Select a question</option>
                        <option value="What is your mother's maiden name?">What is your mother's maiden name?</option>
                        <option value="What was the name of your first pet?">What was the name of your first pet?
                        </option>
                        <option value="What was the name of your first school?">What was the name of your first school?
                        </option>
                        <option value="In what city were you born?">In what city were you born?</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="securityAnswer">Security Answer</label>
                    <input type="text" id="securityAnswer" name="securityAnswer" required placeholder="Your answer">
                </div>

                <!-- Business Fields (Hidden by default) -->
                <div id="businessFields"
                    style="display:none; padding: 1.5rem; background: var(--bg-color); border: 1px solid var(--border); border-radius: var(--radius-md); margin-bottom: 1.25rem;">
                    <h4 style="font-size: 1rem; margin-bottom: 1rem; color: var(--text-main);">Business Details</h4>
                    <div class="form-group">
                        <label for="businessName">Business Name</label>
                        <input type="text" id="businessName" name="businessName" placeholder="Acme Corp">
                    </div>
                    <div class="form-group">
                        <label for="businessType">Business Type (Industry)</label>
                        <input type="text" id="businessType" name="businessType" placeholder="e.g. Retail, Tech">
                    </div>
                    <div class="form-group">
                        <label for="taxId">Tax ID / Registration Number</label>
                        <input type="text" id="taxId" name="taxId" placeholder="XX-XXXXXXX">
                    </div>
                    <div class="form-group" style="margin-bottom: 0;">
                        <label for="businessAddress">Business Address</label>
                        <textarea id="businessAddress" name="businessAddress" rows="2"
                            placeholder="123 Business St, City"></textarea>
                    </div>
                </div>

                <div id="errorMessage" class="alert alert-error" style="display:none; margin-bottom: 1.25rem;"></div>
                <div id="successMessage" class="alert alert-success" style="display:none; margin-bottom: 1.25rem;">
                </div>

                <button type="submit" class="btn btn-primary"
                    style="width: 100%; padding: 0.8rem; font-size: 1rem; margin-top: 0.5rem;">
                    Create Account
                </button>

                <p class="text-center mt-4 pt-4"
                    style="font-size: 0.95rem; color: var(--text-secondary); border-top: 1px solid var(--border); padding-top: 1.25rem;">
                    Already have an account? <a th:href="@{/login}" style="font-weight: 600;">Sign in</a>
                </p>
            </form>
        </div>
    </div>

    <div th:replace="~{fragments/layout :: footerFragment}"></div>

    <script>
        function toggleBusinessFields() {
            const type = document.getElementById("accountType").value;
            const bFields = document.getElementById("businessFields");
            if (type === "BUSINESS") {
                bFields.style.display = "block";
                document.getElementById("businessName").required = true;
                document.getElementById("taxId").required = true;
            } else {
                bFields.style.display = "none";
                document.getElementById("businessName").required = false;
                document.getElementById("taxId").required = false;
            }
        }

        async function submitRegister() {
            const type = document.getElementById("accountType").value;
            const endpoint = type === "BUSINESS" ? '/api/auth/register/business' : '/api/auth/register/personal';
            const btn = document.querySelector('#registerForm button[type="submit"]');

            const payload = {
                user: {
                    fullName: document.getElementById("fullName").value,
                    email: document.getElementById("email").value,
                    phoneNumber: document.getElementById("phone").value,
                    securityQuestion: document.getElementById("securityQuestion").value,
                    securityAnswer: document.getElementById("securityAnswer").value,
                    transactionPin: document.getElementById("transactionPin").value,
                    businessName: document.getElementById("businessName").value,
                    businessType: document.getElementById("businessType").value,
                    taxId: document.getElementById("taxId").value,
                    businessAddress: document.getElementById("businessAddress").value
                },
                password: document.getElementById("password").value
            };

            setButtonLoading(btn, true, 'Registering...');
            try {
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    const err = await response.json();
                    throw new Error(err.message || "Registration failed");
                }

                sessionStorage.setItem('autoLoginEmail', payload.user.email);
                sessionStorage.setItem('autoLoginPassword', payload.password);
                window.location.href = '/login';
            } catch (error) {
                document.getElementById("errorMessage").innerText = error.message;
                document.getElementById("errorMessage").style.display = "block";
                document.getElementById("successMessage").style.display = "none";
            } finally {
                setButtonLoading(btn, false);
            }
        }
    </script>
</body>

</html>
